      - lblPasteHint:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="For the weekly refresh: select the roster in Excel (two columns, Name then Email), copy, and paste below. This replaces every current member of this group in one go."
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
            Color: =RGBA(120,120,120,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =183
            Y: =204
            Width: =1000
            Height: =36
      - txtPasteRoster:
          Control: Classic/TextInput@2.3.2
          Properties:
            HintText: ="Paste rows here - either the standard sheet (Bde/Area, County/District, Rank, First Name, Surname, Appointment, Email) or just Name (Tab) Email, one person per line"
            Mode: =TextMode.MultiLine
            BorderColor: =RGBA(0,18,107,1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0,18,107,1)
            HoverFill: =RGBA(186,202,226,1)
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
            OnChange: |-
              =Set(varRosterLines, Filter(Split(txtPasteRoster.Text, Char(10)), Trim(Value) <> ""));
              ClearCollect(colParsedRoster,
                  ForAll(
                      varRosterLines,
                      With(
                          {cols: If(Find(Char(9), ThisRecord.Value) > 0, Split(ThisRecord.Value, Char(9)), Split(ThisRecord.Value, ","))},
                          If(
                              CountRows(cols) >= 7,
                              With(
                                  {
                                      jmcVal: Trim(Index(cols, 1).Value),
                                      countyVal: Trim(Index(cols, 2).Value),
                                      rankVal: Trim(Index(cols, 3).Value),
                                      firstVal: Trim(Index(cols, 4).Value),
                                      surnameVal: Trim(Index(cols, 5).Value),
                                      emailVal: Trim(Index(cols, 7).Value)
                                  },
                                  With(
                                      {properFirst: Concat(Sequence(Len(firstVal)), If(Value = 1 || Mid(firstVal, Value - 1, 1) = " " || Mid(firstVal, Value - 1, 1) = "-" || Mid(firstVal, Value - 1, 1) = "'", Upper(Mid(firstVal, Value, 1)), Lower(Mid(firstVal, Value, 1))), "")},
                                      {Name: Trim(rankVal & " " & properFirst & " " & Upper(surnameVal)), Email: Lower(emailVal), JMC: jmcVal, County: countyVal}
                                  )
                              ),
                              With(
                                  {emailVal2: Trim(Last(cols).Value), nameVal2: Trim(First(cols).Value)},
                                  {Name: nameVal2, Email: Lower(emailVal2), JMC: "", County: ""}
                              )
                          )
                      )
                  )
              );
              ClearCollect(colParsedRosterValid, Filter(colParsedRoster, IsMatch(Email, Match.Email)));
              Set(varParsedRosterCount, CountRows(colParsedRosterValid));
              Set(varParsedRosterSkipped, CountRows(colParsedRoster) - varParsedRosterCount);
              Set(varPasteCurrentCount, With({groupTitle: LookUp(colGroups, ID = varManageGroupID).Title}, CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(groupTitle))))));
              Set(varPasteAddCount, With({groupTitle: LookUp(colGroups, ID = varManageGroupID).Title}, CountRows(Filter(colParsedRosterValid As pr, CountRows(Filter(colMemberships As mem, Lower(Trim(mem.GroupName)) = Lower(Trim(groupTitle)) && Lower(mem.Email) = Lower(pr.Email))) = 0))));
              Set(varPasteRemoveCount, With({groupTitle: LookUp(colGroups, ID = varManageGroupID).Title}, CountRows(Filter(colMemberships As mem, Lower(Trim(mem.GroupName)) = Lower(Trim(groupTitle)) && CountRows(Filter(colParsedRosterValid As pr, Lower(pr.Email) = Lower(mem.Email))) = 0))));
              Set(varPasteUnchangedCount, With({groupTitle: LookUp(colGroups, ID = varManageGroupID).Title}, CountRows(Filter(colParsedRosterValid As pr, CountRows(Filter(colMemberships As mem, Lower(Trim(mem.GroupName)) = Lower(Trim(groupTitle)) && Lower(mem.Email) = Lower(pr.Email))) > 0))));
              Set(varConfirmReplaceArmed, false)
            X: =183
            Y: =244
            Width: =1000
            Height: =220
      - lblPastePreview:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(varParsedRosterCount = 0 && varParsedRosterSkipped = 0, "", varParsedRosterCount & " valid row" & If(varParsedRosterCount = 1, "", "s") & " parsed" & If(varParsedRosterSkipped > 0, ", " & varParsedRosterSkipped & " line" & If(varParsedRosterSkipped = 1, "", "s") & " skipped (no valid email)", "") & ". Current: " & varPasteCurrentCount & " · Add: " & varPasteAddCount & " · Remove: " & varPasteRemoveCount & " · Unchanged: " & varPasteUnchangedCount & ".")
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
            Color: =RGBA(120,120,120,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =183
            Y: =472
            Width: =1000
            Height: =22
      - lblPasteSafetyNote:
          Control: Label@2.5.1
          Properties:
            Text: =If(varParsedRosterCount = 0, "", "Review the diff counts before confirming. Replace removes every current row for this group, then writes the valid pasted rows.")
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
            Color: =RGBA(138,80,0,1)
            Size: =11
            Font: =Font.'Open Sans'
            X: =183
            Y: =492
            Width: =1000
            Height: =22
      - btnReplaceRoster:
          Control: ModernButton@1.0.0
          Properties:
            Text: |-
              =If(
                  varConfirmReplaceArmed,
                  "Tap again to confirm - replaces all " &
                      With(
                          {groupTitle: If(varManageGroupID = 0, "", LookUp(colGroups, ID = varManageGroupID).Title)},
                          CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(groupTitle))))
                      ) & " current members",
                  "Replace membership from paste"
              )
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
            BasePaletteColor: =RGBA(163,45,45,1)
            OnSelect: |-
              =If(
                  varParsedRosterCount = 0,
                  Notify("Paste some rows first.", NotificationType.Warning),
                  !varConfirmReplaceArmed,
                  Set(varConfirmReplaceArmed, true),
                  Set(varGroupTitle, LookUp(colGroups, ID = varManageGroupID).Title);
                  Set(varOldRosterCount, CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(varGroupTitle)))));
                  RemoveIf('BM Memberships', Lower(Trim(GroupName)) = Lower(Trim(varGroupTitle)));
                  ForAll(colParsedRosterValid, Patch('BM Memberships', Defaults('BM Memberships'), {Title: Name, Name: Name, Email: Email, GroupName: varGroupTitle, JMC: JMC, 'County/Contingent': County}));
                  ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
                  Patch('BM Groups', LookUp('BM Groups', ID = varManageGroupID), {Title: varGroupTitle});
                  Patch('BM History', Defaults('BM History'), {Title: "Bulk replace via paste: " & varOldRosterCount & " removed, " & varParsedRosterCount & " added", GroupName: varGroupTitle, EventType: {Value: "Replaced"}});
                  Reset(txtPasteRoster);
                  Set(varParsedRosterCount, 0);
                  Set(varParsedRosterSkipped, 0);
                  Set(varPasteCurrentCount, 0);
                  Set(varPasteAddCount, 0);
                  Set(varPasteRemoveCount, 0);
                  Set(varPasteUnchangedCount, 0);
                  Set(varConfirmReplaceArmed, false);
                  Notify("Replaced membership of " & varGroupTitle & ".", NotificationType.Success)
              )
            X: =183
            Y: =522
            Width: =1000
            Height: =44
