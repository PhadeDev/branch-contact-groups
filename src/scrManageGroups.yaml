Screens:
  scrManageGroups:
    Properties:
      Fill: =RGBA(246,248,247,1)
      OnVisible: |-
        =If(
            !varIsMaintainer,
            Back(),
            Set(varNotePreviewID, 0);
            Set(varPasteFormat, "csv");
            Set(varRenameBusy, false);
            Set(varRenameTimerOn, false);
            Set(varRenameFinal, false);
            Set(varCustSearching, false);
            ClearCollect(colEditCustodians, Filter(Table({Email: "", Name: ""}), false));
            ClearCollect(colCustSearchResults, Filter(Table({DisplayName: "", Mail: ""}), false));
            Set(varRenameTotal, 0);
            Set(varRenameDone, 0);
            ClearCollect(colRenameQueue, Filter(Table({ID: 0}), false));
            Set(varErrManualName, false);
            Set(varErrManualEmail, false);
            Set(varErrMaintainerName, false);
            Set(varErrMaintainerEmail, false);
            Set(varGalSearching, false);
            Set(varMaintainerSearching, false);
            Set(varShowMemberEditDialog, false);
            Set(varGalPickName, "");
            Set(varGalPickEmail, "");
            Set(varManageGroupID, 0);
            Set(varEditingMemberID, 0);
            Set(varPendingRemoveMemberID, 0);
            Set(varPendingRemoveMaintainerID, 0);
            Set(varShowLightbox, false);
            Set(varLightboxMode, "history");
            Set(varManageSubTab, "members");
            Set(varParsedRosterCount, 0);
            Set(varParsedRosterSkipped, 0);
            Set(varPasteCurrentCount, 0);
            Set(varPasteAddCount, 0);
            Set(varPasteRemoveCount, 0);
            Set(varPasteUnchangedCount, 0);
            Set(varConfirmReplaceArmed, false);
            Set(varConfirmDeleteGroupArmed, false);
            ClearCollect(colParsedRoster, Filter(colMemberships, false));
            ClearCollect(colExistingPeoplePicks, AddColumns(GroupBy(Filter(colMemberships, false), Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows), Picked, false));
            ClearCollect(colHealthChecks, Table({Severity: "OK", Issue: "Health checks not run yet", Detail: "Open Health Check to scan the current local data cache."}));
            Clear(colGalSearchResults);
            Clear(colMaintainerGalSearchResults)
        )
    Children:
      - recHeaderMg:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(0,78,66,1)
            HoverFill: =RGBA(0,78,66,1)
            PressedFill: =RGBA(0,78,66,1)
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =1366
            Height: =72
      - icoBackMg:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(230,241,251,1)
            OnSelect: =Back()
            X: =16
            Y: =24
            Width: =24
            Height: =24
      - lblHeaderTitleMg:
          Control: Label@2.5.1
          Properties:
            Text: ="Manage Groups"
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =52
            Y: =10
            Width: =600
            Height: =32
      - lblHeaderSubMg:
          Control: Label@2.5.1
          Properties:
            Text: ="Create groups, manage membership, and clear out leavers"
            Color: =RGBA(214,232,227,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =52
            Y: =44
            Width: =600
            Height: =22
      - btnHomeManage:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Home"
            Tooltip: ="Go to the Branch Contact Groups home screen"
            Fill: =RGBA(255,255,255,0.16)
            HoverFill: =RGBA(255,255,255,0.28)
            PressedFill: =RGBA(255,255,255,0.28)
            BorderColor: =RGBA(255,255,255,0.45)
            BorderThickness: =1
            Color: =RGBA(255,255,255,1)
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            OnSelect: =Navigate(scrQuickContacts, ScreenTransition.None)
            X: =830
            Y: =16
            Width: =140
            Height: =40
      - btnPeopleNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Manage People"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: =Navigate(scrManagePeople, ScreenTransition.Cover)
            X: =1180
            Y: =16
            Width: =160
            Height: =40
      - btnMaintainersNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Manage Maintainers"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =ClearCollect(colMaintainers, 'BM Maintainers');
              Set(varLightboxMode, "adminMaintainers");
              Set(varPendingRemoveMaintainerID, 0);
              Set(varErrMaintainerName, false);
              Set(varErrMaintainerEmail, false);
              Reset(txtMaintainerSearch);
              Reset(txtMaintainerName);
              Reset(txtMaintainerEmail);
              Clear(colMaintainerGalSearchResults);
              Set(varShowLightbox, true)
            X: =990
            Y: =16
            Width: =180
            Height: =40
      - lblAllGroupsHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="All Groups"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =16
            Font: =Font.'Open Sans'
            X: =20
            Y: =88
            Width: =340
            Height: =26
      - btnNewGroup:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="+ New Group"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varManageGroupID, 0);
              Set(varLightboxMode, "edit");
              Reset(txtEditTitle);
              Reset(txtEditNotes);
              Reset(drpEditThursdayBatch);
              Reset(chkEditCustodians);
              Reset(txtCustSearch);
              Clear(colCustSearchResults);
              ClearCollect(colEditCustodians, ForAll(Filter(Split(Coalesce(LookUp(colGroups, ID = varManageGroupID).CustodianEmails, ""), ";"), !IsBlank(Trim(Value))) As c, {Email: Trim(c.Value), Name: IfError(Office365Users.UserProfileV2(Trim(c.Value)).displayName, Trim(c.Value))}));
              Reset(chkEditPrivate);
              Reset(chkEditSensitive);
              Reset(chkEditOfficialUse);
              Reset(chkOverrideDate);
              Reset(datEditManualDate);
              Set(varConfirmDeleteGroupArmed, false);
              Set(varShowLightbox, true)
            X: =1150
            Y: =84
            Width: =190
            Height: =36
      - btnRefreshManageData:
          Control: ModernButton@1.0.0
          Properties:
            Text: =If(varCacheReady, "Refresh", "Refreshing...")
            DisplayMode: =If(varCacheReady, DisplayMode.Edit, DisplayMode.Disabled)
            BasePaletteColor: =RGBA(120,120,120,1)
            OnSelect: |-
              =If(LoadCache(), Notify("Refreshed groups and memberships.", NotificationType.Success))
            X: =748
            Y: =84
            Width: =180
            Height: =36
      - btnImportNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Import from paste"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: =Navigate(scrImport, ScreenTransition.Cover)
            X: =372
            Y: =84
            Width: =172
            Height: =36
      - btnThursdayBatchNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Thursday Batches"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varLightboxMode, "adminThursdayBatch");
              Set(varShowLightbox, true)
            X: =560
            Y: =84
            Width: =172
            Height: =36
      - btnHealthCheck:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Health Check"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =ClearCollect(
                  colHealthChecks,
                  Table(
                      {Severity: If(CountRows(Filter(colMemberships, IsBlank(Trim(Name)))) = 0, "OK", "Fix"), Issue: "Blank Name values", Detail: CountRows(Filter(colMemberships, IsBlank(Trim(Name)))) & " membership row(s) have blank Name. Backfill Name from Title before using these screens."},
                      {Severity: If(CountRows(Filter(colMemberships, (IsBlank(Trim(Email)) && !(GroupName in Filter(colGroups, HasCustodians = true).Title)) || (!IsBlank(Trim(Email)) && !IsMatch(Email, Match.Email)))) = 0, "OK", "Fix"), Issue: "Blank or invalid email addresses (blank is fine in custodian groups)", Detail: CountRows(Filter(colMemberships, (IsBlank(Trim(Email)) && !(GroupName in Filter(colGroups, HasCustodians = true).Title)) || (!IsBlank(Trim(Email)) && !IsMatch(Email, Match.Email)))) & " membership row(s) have a blank or invalid email."},
                      {Severity: If(CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) = 0)) = 0, "OK", "Fix"), Issue: "Memberships pointing at missing groups", Detail: CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) = 0)) & " row(s) have a GroupName that does not match any current group title."}
                  )
              );
              Set(varLightboxMode, "adminHealth");
              Set(varShowLightbox, true)
            X: =944
            Y: =84
            Width: =190
            Height: =36
      - lblManageLastRefresh:
          Control: Label@2.5.1
          Properties:
            Text: ="Loaded " & Text(varLastMembershipRefresh, "[$-en-GB]d mmm HH:mm")
