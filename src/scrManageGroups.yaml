          Control: ModernButton@1.0.0
          Properties:
            Text: ="Stop"
            Visible: =varRenameBusy
            BasePaletteColor: =RGBA(163,45,45,1)
            OnSelect: |-
              =Set(varRenameTimerOn, false);
              Set(varRenameBusy, false);
              Notify("Rename stopped. " & CountRows(colRenameQueue) & " member(s) still have the old name. Open the group and press Save again to finish.", NotificationType.Warning)
            X: =833
            Y: =436
            Width: =120
            Height: =40
      - tmrRename:
          Control: Timer@2.1.0
          Properties:
            Duration: =150
            Repeat: =true
            AutoStart: =false
            Start: =varRenameTimerOn
            Visible: =true
            Fill: =RGBA(0,0,0,0)
            Color: =RGBA(0,0,0,0)
            BorderThickness: =0
            OnTimerEnd: |-
              =If(
                  CountRows(colRenameQueue) > 0,
                  IfError(
                      With(
                          {batch: FirstN(colRenameQueue, 4)},
                          ForAll(
                              batch As q,
                              Patch('BM Memberships', LookUp('BM Memberships', ID = q.ID), {GroupName: varRenameNew});
                              UpdateIf(colMemberships, ID = q.ID, {GroupName: varRenameNew})
                          );
                          RemoveIf(colRenameQueue, ID in batch.ID)
                      );
                      Set(varRenameDone, varRenameTotal - CountRows(colRenameQueue)),
                      Set(varRenameTimerOn, false);
                      Set(varRenameBusy, false);
                      Notify("Rename stopped: " & FirstError.Message & " " & CountRows(colRenameQueue) & " member(s) still have the old name. Open the group and press Save again to finish.", NotificationType.Error)
                  ),
                  Set(varRenameTimerOn, false);
                  If(
                      !varRenameFinal,
                      Set(varRenameFinal, true);
                      IfError(
                          Patch('BM Groups', LookUp('BM Groups', ID = varRenameGroupID), {Title: varRenameNew});
                          UpdateIf('BM History', GroupName = varRenameOld, {GroupName: varRenameNew});
                          ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
                          Patch('BM History', Defaults('BM History'), {Title: "Group renamed from " & varRenameOld & " (" & varRenameTotal & " members updated)", GroupName: varRenameNew, EventType: {Value: "Edited"}});
                          Set(varRenameBusy, false);
                          Set(varShowLightbox, false);
                          Notify("Saved. The group name was changed on " & varRenameTotal & " members.", NotificationType.Success),
                          Set(varRenameBusy, false);
                          Notify("Could not finish the rename: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            X: =0
            Y: =0
            Width: =2
            Height: =2
