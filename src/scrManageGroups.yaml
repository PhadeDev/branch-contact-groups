                  Set(varGroupTitle, LookUp(colGroups, ID = varManageGroupID).Title);
                  Set(varOldRosterCount, CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(varGroupTitle)))));
                  RemoveIf('BM Memberships', Lower(Trim(GroupName)) = Lower(Trim(varGroupTitle)));
                  RemoveIf(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(varGroupTitle)));
                  ForAll(colParsedRosterValid, Collect(colMemberships, Patch('BM Memberships', Defaults('BM Memberships'), {Title: Name, Name: Name, Email: Email, GroupName: varGroupTitle, JMC: JMC, 'County/Contingent': County})));
                  Set(varPasteDateText, If(chkPasteSetDate.Checked, " Last-updated date set to " & Text(datPasteDate.SelectedDate, "dd/mm/yyyy") & ".", " Last-updated date left as it was."));
                  If(chkPasteSetDate.Checked, Patch('BM Groups', LookUp('BM Groups', ID = varManageGroupID), {ManuallySetModified: datPasteDate.SelectedDate}));
                  ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
                  Patch('BM History', Defaults('BM History'), {Title: "Bulk replace via " & If(varPasteFormat = "outlook", "Outlook paste", "CSV/Excel paste") & ": " & varOldRosterCount & " removed, " & varParsedRosterCount & " added", GroupName: varGroupTitle, EventType: {Value: "Replaced"}});
                  Reset(txtPasteRoster);
                  Set(varParsedRosterCount, 0);
                  Set(varParsedRosterSkipped, 0);
                  Set(varPasteCurrentCount, 0);
                  Set(varPasteAddCount, 0);
                  Set(varPasteRemoveCount, 0);
                  Set(varPasteUnchangedCount, 0);
                  Set(varConfirmReplaceArmed, false);
                  Reset(chkPasteSetDate);
                  Set(varShowLightbox, false);
                  Set(varManageGroupID, 0);
                  Notify("Saved. Replaced membership of " & varGroupTitle & "." & varPasteDateText, NotificationType.Success)
              )
            X: =183
            Y: =522
            Width: =1000
            Height: =44
