            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varAddedName, Trim(txtManualName.Text));
              Set(varAddedEmail, Lower(Trim(txtManualEmail.Text)));
              Set(varAddedJMC, Trim(txtManualJMC.Text));
              Set(varAddedCounty, Trim(txtManualCounty.Text));
              Set(varErrManualName, IsBlank(varAddedName));
              Set(varErrManualEmail, IsBlank(varAddedEmail) || IsBlank(Find("@", varAddedEmail)) || IsBlank(Find(".", varAddedEmail)));
                  If(
                      varErrManualName || varErrManualEmail,
                      Notify("Enter a name and a valid email address.", NotificationType.Warning),
                      varEditingMemberID <> 0 && CountRows(Filter(colMemberships, ID <> varEditingMemberID, Lower(Trim(GroupName)) = Lower(Trim(LookUp(colGroups, ID = varManageGroupID).Title)), Lower(Email) = varAddedEmail)) > 0,
                      Notify("That email is already a member of " & LookUp(colGroups, ID = varManageGroupID).Title & ".", NotificationType.Warning),
                      varEditingMemberID <> 0,
                      Patch('BM Memberships', LookUp('BM Memberships', ID = varEditingMemberID), {Title: varAddedName, Name: varAddedName, Email: varAddedEmail, JMC: varAddedJMC, 'County/Contingent': varAddedCounty});
                  Patch('BM History', Defaults('BM History'), {Title: "Member updated (" & varAddedEmail & ")", GroupName: LookUp(colGroups, ID = varManageGroupID).Title, EventType: {Value: "Edited"}});
