                  "Paste the group as copied from Outlook: names and email addresses separated by semicolons or new lines. Lines ending in a colon (like NAL:) are ignored, so paste one group at a time. This replaces every current member of this group in one go.",
                  "For the weekly refresh: select the roster in Excel (two columns, Name then Email), copy, and paste below. This replaces every current member of this group in one go."
              )
            Visible: =varShowLightbox && varLightboxMode = "manage" && varManageSubTab = "paste"
