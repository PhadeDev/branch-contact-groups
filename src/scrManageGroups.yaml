                      RemoveIf('BM Memberships', Lower(Trim(GroupName)) = Lower(Trim(deletedTitle)));
                      RemoveIf('BM History', Lower(Trim(GroupName)) = Lower(Trim(deletedTitle)));
                      Remove('BM Groups', LookUp('BM Groups', ID = varManageGroupID));
                      RemoveIf(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(deletedTitle)));
                      ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
                      Set(varConfirmDeleteGroupArmed, false);
                      Set(varShowLightbox, false);
                      Set(varManageGroupID, 0);
