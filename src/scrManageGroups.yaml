                  Visible: =ThisItem.Private
                  Fill: =RGBA(233,225,245,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  Color: =RGBA(107,79,160,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =10
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  X: =830
                  Y: =17
                  Width: =90
                  Height: =24
            - lblRowMeta:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =With(
                        {effectiveDate: Coalesce(ThisItem.ManuallySetModified, ThisItem.Modified)},
                        CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(ThisItem.Title)))) & " members · " & Text(effectiveDate, "d mmm yy")
                    )
                  Wrap: =false
                  Color: =RGBA(120,120,120,1)
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =930
                  Y: =18
                  Width: =220
                  Height: =22
            - recRowClickCatcher:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0,0,0,0)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  OnSelect: |-
                    =Set(varManageGroupID, ThisItem.ID);
                    Set(varLightboxMode, "edit");
                    Reset(txtEditTitle);
                    Reset(txtEditNotes);
                    Reset(drpEditThursdayBatch);
                    Reset(chkEditPrivate);
                    Reset(chkEditSensitive);
                    Reset(chkEditOfficialUse);
                    Reset(chkOverrideDate);
                    Reset(datEditManualDate);
                    Set(varConfirmDeleteGroupArmed, false);
                    Set(varShowLightbox, true)
                  X: =0
                  Y: =0
                  Width: =1320
                  Height: =56
            - icoRowManageMembers:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.People
                  Color: =RGBA(46,110,145,1)
                  OnSelect: |-
                    =Set(varManageGroupID, ThisItem.ID);
                    Set(varLightboxMode, "manage");
                    Set(varManageSubTab, "members");
                    Set(varEditingMemberID, 0);
                    Set(varPendingRemoveMemberID, 0);
                    Reset(txtPasteRoster);
                    Reset(txtGalSearch);
                    Reset(txtExistingPeopleSearch);
                    ClearCollect(colExistingPeoplePicks, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows), Picked, false));
                    ClearCollect(colGalSearchResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
                    Set(varParsedRosterCount, 0);
                    Set(varConfirmReplaceArmed, false);
                    Set(varShowLightbox, true)
                  X: =1180
                  Y: =16
                  Width: =28
                  Height: =28
            - icoRowHistory:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.History
                  Color: =RGBA(46,110,145,1)
                  OnSelect: |-
                    =Set(varManageGroupID, ThisItem.ID);
                    Set(varLightboxMode, "history");
                    Set(varShowLightbox, true)
                  X: =1220
                  Y: =16
                  Width: =28
                  Height: =28
            - icoRowEdit:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Edit
                  Color: =RGBA(46,110,145,1)
                  OnSelect: |-
                    =Set(varManageGroupID, ThisItem.ID);
                    Set(varLightboxMode, "edit");
                    Reset(txtEditTitle);
                    Reset(txtEditNotes);
                    Reset(drpEditThursdayBatch);
                    Reset(chkEditPrivate);
                    Reset(chkEditSensitive);
                    Reset(chkEditOfficialUse);
                    Reset(chkOverrideDate);
                    Reset(datEditManualDate);
                    Set(varConfirmDeleteGroupArmed, false);
                    Set(varShowLightbox, true)
                  X: =1260
                  Y: =16
                  Width: =28
                  Height: =28
      - recLightboxBackdrop:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =varShowLightbox
            Fill: =RGBA(15,25,20,0.45)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            BorderThickness: =0
            OnSelect: |-
              =Set(varShowLightbox, false);
              Set(varManageGroupID, 0);
              Set(varEditingMemberID, 0);
              Reset(txtManualName);
              Reset(txtManualEmail);
              Reset(txtManualJMC);
              Reset(txtManualCounty)
            X: =0
            Y: =0
            Width: =1366
            Height: =768
      - recLightboxPanel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            DisplayMode: =DisplayMode.View
            Visible: =varShowLightbox
            Fill: =RGBA(255,255,255,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            BorderThickness: =0
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            X: =113
            Y: =54
            Width: =1140
            Height: =660
      - lblLightboxTitle:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =Switch(
                  varLightboxMode,
                  "edit", If(varManageGroupID = 0, "New group", "Edit group"),
                  "adminMaintainers", "Manage maintainers",
                  "adminHealth", "Admin health check",
                  If(varManageGroupID = 0, "", LookUp(colGroups, ID = varManageGroupID).Title & If(varLightboxMode = "history", " - History", ""))
              )
            Visible: =varShowLightbox
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =183
            Y: =78
            Width: =1000
            Height: =32
      - icoLightboxClose:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =varShowLightbox
            Color: =RGBA(120,120,120,1)
            OnSelect: |-
              =Set(varShowLightbox, false);
              Set(varManageGroupID, 0);
              Set(varEditingMemberID, 0);
              Reset(txtManualName);
              Reset(txtManualEmail);
              Reset(txtManualJMC);
              Reset(txtManualCounty)
            X: =1209
            Y: =78
            Width: =28
            Height: =28
      - lblHealthSummary:
          Control: Label@2.5.1
          Properties:
            Text: ="Scans the current loaded cache. Use Refresh first if SharePoint was changed outside the app."
            Visible: =varShowLightbox && varLightboxMode = "adminHealth"
            Color: =RGBA(120,120,120,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =183
            Y: =124
            Width: =1000
            Height: =28
      - galHealthChecks:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colHealthChecks
            Visible: =varShowLightbox && varLightboxMode = "adminHealth"
            TemplateSize: =72
            TemplatePadding: =0
            X: =183
            Y: =164
            Width: =1000
            Height: =500
          Children:
            - recHealthRow:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  DisplayMode: =DisplayMode.View
                  Fill: =If(ThisItem.Severity = "OK", RGBA(244,249,247,1), ThisItem.Severity = "Info", RGBA(244,248,252,1), ThisItem.Severity = "Check", RGBA(255,249,235,1), RGBA(252,238,238,1))
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderColor: =If(ThisItem.Severity = "OK", RGBA(214,232,227,1), ThisItem.Severity = "Info", RGBA(200,220,236,1), ThisItem.Severity = "Check", RGBA(224,178,92,1), RGBA(163,45,45,1))
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  X: =0
                  Y: =4
                  Width: =1000
                  Height: =62
            - lblHealthSeverity:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Severity
                  Color: =If(ThisItem.Severity = "OK", RGBA(0,78,66,1), ThisItem.Severity = "Info", RGBA(46,110,145,1), ThisItem.Severity = "Check", RGBA(138,80,0,1), RGBA(163,45,45,1))
                  FontWeight: =FontWeight.Bold
                  Size: =12
                  Font: =Font.'Open Sans'
                  X: =16
                  Y: =14
                  Width: =70
                  Height: =22
            - lblHealthIssue:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Issue
                  Color: =RGBA(31,58,95,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Font: =Font.'Open Sans'
                  X: =100
                  Y: =10
                  Width: =860
                  Height: =22
            - lblHealthDetail:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Detail
                  Color: =RGBA(90,90,90,1)
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =100
                  Y: =34
                  Width: =860
                  Height: =22
      - txtEditTitle:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =If(varManageGroupID = 0, "", LookUp(colGroups, ID = varManageGroupID).Title)
            Placeholder: ="Group name"
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =124
            Width: =1000
            Height: =42
      - txtEditNotes:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =If(varManageGroupID = 0, "", LookUp(colGroups, ID = varManageGroupID).Notes)
            Placeholder: ="Notes (optional)"
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =176
            Width: =1000
            Height: =42
      - drpEditThursdayBatch:
          Control: ModernDropdown@1.0.1
          Properties:
            Items: =colThursdayBatchOptions
            Default: =LookUp(colThursdayBatchOptions, Lower(Trim(Value)) = Lower(Trim(Coalesce(LookUp(colGroups, ID = varManageGroupID).ThursdayBatch.Value, "None"))))
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =228
            Width: =200
            Height: =42
      - chkEditPrivate:
          Control: CheckBox@0.0.30
          Properties:
            BasePaletteColor: =RGBA(156, 220, 79, 1)
            CheckboxSize: =22
            Label: ="Private (maintainers only)"
            Checked: =If(varManageGroupID = 0, false, LookUp(colGroups, ID = varManageGroupID).Private)
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =282
            Width: =420
            Height: =32
      - chkEditSensitive:
          Control: CheckBox@0.0.30
          Properties:
            BasePaletteColor: =RGBA(156, 220, 79, 1)
            CheckboxSize: =22
            Label: ="Official Sensitive Approved"
            Checked: =If(varManageGroupID = 0, false, LookUp(colGroups, ID = varManageGroupID).OfficialSensitiveApproved)
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =322
            Width: =420
            Height: =32
      - chkEditOfficialUse:
          Control: CheckBox@0.0.30
          Properties:
            BasePaletteColor: =RGBA(156, 220, 79, 1)
            CheckboxSize: =22
            Label: ="Official Use Only"
            Checked: =If(varManageGroupID = 0, false, LookUp(colGroups, ID = varManageGroupID).OfficialUseOnly)
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =362
            Width: =420
            Height: =32
      - chkOverrideDate:
          Control: CheckBox@0.0.30
          Properties:
            BasePaletteColor: =RGBA(156, 220, 79, 1)
            CheckboxSize: =22
            Label: ="Override last modified date"
            Checked: =If(varManageGroupID = 0, false, !IsBlank(LookUp(colGroups, ID = varManageGroupID).ManuallySetModified))
            Visible: =varShowLightbox && varLightboxMode = "edit"
            X: =183
            Y: =402
            Width: =420
            Height: =32
      - datEditManualDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            DefaultDate: =If(varManageGroupID = 0 || IsBlank(LookUp(colGroups, ID = varManageGroupID).ManuallySetModified), Today(), LookUp(colGroups, ID = varManageGroupID).ManuallySetModified)
            Visible: =varShowLightbox && varLightboxMode = "edit" && chkOverrideDate.Checked
            X: =603
            Y: =398
            Width: =220
            Height: =40
      - btnSaveGroupEdit:
          Control: ModernButton@1.0.0
          Properties:
            Text: =If(varManageGroupID = 0, "Create group", "Save")
            Visible: =varShowLightbox && varLightboxMode = "edit"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =With(
                  {
                      newTitle: Trim(txtEditTitle.Text),
                      oldTitle: If(varManageGroupID = 0, "", LookUp(colGroups, ID = varManageGroupID).Title)
                  },
                  If(
                      IsBlank(newTitle),
                      Notify("Group name can't be blank.", NotificationType.Warning),
                      CountRows(Filter(colGroups, Lower(Trim(Title)) = Lower(newTitle) && (varManageGroupID = 0 || ID <> varManageGroupID))) > 0,
                      Notify("A group with that name already exists.", NotificationType.Warning),
                      varManageGroupID = 0,
                      Patch('BM Groups', Defaults('BM Groups'), {
                          Title: newTitle,
                          Notes: Trim(txtEditNotes.Text),
                          ThursdayBatch: {Value: drpEditThursdayBatch.Selected.Value},
                          Private: chkEditPrivate.Checked,
                          OfficialSensitiveApproved: chkEditSensitive.Checked,
                          OfficialUseOnly: chkEditOfficialUse.Checked,
                          ManuallySetModified: If(chkOverrideDate.Checked, datEditManualDate.SelectedDate, Blank())
                      });
                      Patch('BM History', Defaults('BM History'), {Title: "Group created", GroupName: newTitle, EventType: {Value: "Created"}});
                      ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
                      Set(varShowLightbox, false);
                      Notify("Created " & newTitle & ".", NotificationType.Success),
                      Patch('BM Groups', LookUp('BM Groups', ID = varManageGroupID), {
                          Title: newTitle,
                          Notes: Trim(txtEditNotes.Text),
                          ThursdayBatch: {Value: drpEditThursdayBatch.Selected.Value},
                          Private: chkEditPrivate.Checked,
                          OfficialSensitiveApproved: chkEditSensitive.Checked,
                          OfficialUseOnly: chkEditOfficialUse.Checked,
                          ManuallySetModified: If(chkOverrideDate.Checked, datEditManualDate.SelectedDate, Blank())
                      });
                      If(
                          Lower(Trim(newTitle)) <> Lower(Trim(oldTitle)),
                          UpdateIf('BM Memberships', Lower(Trim(GroupName)) = Lower(Trim(oldTitle)), {GroupName: newTitle});
                          UpdateIf('BM History', Lower(Trim(GroupName)) = Lower(Trim(oldTitle)), {GroupName: newTitle})
                      );
                      ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
