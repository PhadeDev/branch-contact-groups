                  Notify("Updated " & varAddedName & ".", NotificationType.Success),
                  With(
                      {groupTitle: LookUp(colGroups, ID = varManageGroupID).Title},
                      CountRows(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(Trim(groupTitle)) && Lower(Email) = varAddedEmail)) > 0
                  ),
                  Notify("That email is already a member of " & LookUp(colGroups, ID = varManageGroupID).Title & ".", NotificationType.Warning),
                  Set(varNewRow, Patch('BM Memberships', Defaults('BM Memberships'), {Title: varAddedName, Name: varAddedName, Email: varAddedEmail, GroupName: LookUp(colGroups, ID = varManageGroupID).Title, JMC: varAddedJMC, 'County/Contingent': varAddedCounty}));
                  Collect(colMemberships, varNewRow);
                  Patch('BM Groups', LookUp('BM Groups', ID = varManageGroupID), {Title: LookUp(colGroups, ID = varManageGroupID).Title});
                  Patch('BM History', Defaults('BM History'), {Title: varAddedName & " added manually (" & varAddedEmail & ")", GroupName: LookUp(colGroups, ID = varManageGroupID).Title, EventType: {Value: "Added"}});
                  Reset(txtManualName);
                  Reset(txtManualEmail);
