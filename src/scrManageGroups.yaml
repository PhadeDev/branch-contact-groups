Screens:
  scrManageGroups:
    Properties:
      Fill: =RGBA(255,255,255,1)
      OnVisible: |-
        =If(
            !varIsMaintainer,
            Back(),
            ClearCollect(colMaintainers, 'BM Maintainers');
            Set(varErrManualName, false);
            Set(varErrManualEmail, false);
            Set(varErrMaintainerName, false);
            Set(varErrMaintainerEmail, false);
            Set(varGalSearching, false);
            Set(varMaintainerSearching, false);
            Set(varManageGroupID, 0);
            Set(varEditingMemberID, 0);
            Set(varPendingRemoveMemberID, 0);
            Set(varPendingRemoveMaintainerID, 0);
            Set(varShowLightbox, false);
            Set(varLightboxMode, "history");
            Set(varManageSubTab, "members");
            Set(varParsedRosterCount, 0);
            Set(varParsedRosterSkipped, 0);
            Set(varPasteCurrentCount, 0);
            Set(varPasteAddCount, 0);
            Set(varPasteRemoveCount, 0);
            Set(varPasteUnchangedCount, 0);
            Set(varConfirmReplaceArmed, false);
            Set(varConfirmDeleteGroupArmed, false);
            ClearCollect(colParsedRoster, Filter(colMemberships, false));
            ClearCollect(colExistingPeoplePicks, AddColumns(GroupBy(Filter(colMemberships, false), Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows), Picked, false));
            ClearCollect(colHealthChecks, Table({Severity: "OK", Issue: "Health checks not run yet", Detail: "Open Health Check to scan the current local data cache."}));
            ClearCollect(colGalSearchResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
            ClearCollect(colMaintainerGalSearchResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
            Set(varLastMembershipRefresh, Now())
        )
    Children:
      - recHeader:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(0,78,66,1)
            HoverFill: =RGBA(0,78,66,1)
            PressedFill: =RGBA(0,78,66,1)
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =1366
            Height: =72
      - icoBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(230,241,251,1)
            OnSelect: =Back()
            X: =16
            Y: =24
            Width: =24
            Height: =24
      - lblHeaderTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Manage Groups"
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =52
            Y: =10
            Width: =600
            Height: =32
      - lblHeaderSub:
          Control: Label@2.5.1
          Properties:
            Text: ="Create groups, manage membership, and clear out leavers"
            Color: =RGBA(214,232,227,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =52
            Y: =44
            Width: =600
            Height: =22
      - btnPeopleNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Manage People"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: =Navigate(scrManagePeople, ScreenTransition.Cover)
            X: =1180
            Y: =16
            Width: =160
            Height: =40
      - btnMaintainersNav:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Manage Maintainers"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =ClearCollect(colMaintainers, 'BM Maintainers');
              Set(varLightboxMode, "adminMaintainers");
              Set(varPendingRemoveMaintainerID, 0);
              Set(varErrMaintainerName, false);
              Set(varErrMaintainerEmail, false);
              Reset(txtMaintainerSearch);
              Reset(txtMaintainerName);
              Reset(txtMaintainerEmail);
              ClearCollect(colMaintainerGalSearchResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
              Set(varShowLightbox, true)
            X: =990
            Y: =16
            Width: =180
            Height: =40
      - lblAllGroupsHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="All Groups"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =16
            Font: =Font.'Open Sans'
            X: =20
            Y: =88
            Width: =400
            Height: =26
      - btnNewGroup:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="+ New Group"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varManageGroupID, 0);
              Set(varLightboxMode, "edit");
              Reset(txtEditTitle);
              Reset(txtEditNotes);
              Reset(drpEditThursdayBatch);
              Reset(chkEditPrivate);
              Reset(chkEditSensitive);
              Reset(chkEditOfficialUse);
              Reset(chkOverrideDate);
              Reset(datEditManualDate);
              Set(varConfirmDeleteGroupArmed, false);
              Set(varShowLightbox, true)
            X: =1150
            Y: =84
            Width: =190
            Height: =36
      - btnRefreshManageData:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Refresh"
            BasePaletteColor: =RGBA(120,120,120,1)
            OnSelect: |-
              =ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
              ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
              ClearCollect(colMaintainers, 'BM Maintainers');
              Set(varLastMembershipRefresh, Now());
              Notify("Refreshed groups and memberships.", NotificationType.Success)
            X: =748
            Y: =84
            Width: =180
            Height: =36
      - btnHealthCheck:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Health Check"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =ClearCollect(
                  colHealthChecks,
                  Table(
                      {Severity: If(CountRows(Filter(colMemberships, IsBlank(Trim(Name)))) = 0, "OK", "Fix"), Issue: "Blank Name values", Detail: CountRows(Filter(colMemberships, IsBlank(Trim(Name)))) & " membership row(s) have blank Name. Backfill Name from Title before using v2.34 screens."},
                      {Severity: If(CountRows(Filter(colMemberships, IsBlank(Trim(Email)) || !IsMatch(Email, Match.Email))) = 0, "OK", "Fix"), Issue: "Blank or invalid email addresses", Detail: CountRows(Filter(colMemberships, IsBlank(Trim(Email)) || !IsMatch(Email, Match.Email))) & " membership row(s) have a blank or invalid email."},
                      {Severity: If(CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) = 0)) = 0, "OK", "Fix"), Issue: "Memberships pointing at missing groups", Detail: CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) = 0)) & " row(s) have a GroupName that does not match any current group title."}
                  )
              );
              Set(varLightboxMode, "adminHealth");
              Set(varShowLightbox, true)
            X: =944
            Y: =84
            Width: =190
            Height: =36
      - lblManageLastRefresh:
          Control: Label@2.5.1
          Properties:
            Text: ="Loaded " & Text(varLastMembershipRefresh, "[$-en-GB]d mmm HH:mm")
            Color: =RGBA(120,120,120,1)
            Size: =10
            Font: =Font.'Open Sans'
            X: =660
            Y: =138
            Width: =200
            Height: =20
      - txtGroupSearch:
          Control: ModernTextInput@1.1.0
          Properties:
            Placeholder: ="Search groups by name..."
            X: =20
            Y: =126
            Width: =620
            Height: =44
      - icoClearGroupSearch:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =!IsBlank(Trim(txtGroupSearch.Text))
            Color: =RGBA(160,160,160,1)
            Tooltip: ="Clear search"
            OnSelect: =Reset(txtGroupSearch)
            X: =588
            Y: =137
            Width: =22
            Height: =22
      - galAllGroups:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =Filter(colGroups, IsBlank(Trim(txtGroupSearch.Text)) || txtGroupSearch.Text in Title)
