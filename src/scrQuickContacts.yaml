      - lblNoMembers:
          Control: Label@2.5.1
          Properties:
            Text: ="There are no members in this list yet."
            Visible: =!IsBlank(varQuickPreviewTitle) && CountRows(galMembersQc.AllItems) = 0
            Color: =RGBA(96,105,103,1)
