      - btnMembersCopy:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Copy addresses"
            Visible: =!IsBlank(varQuickPreviewTitle) && !varCustodianView
            Fill: =RGBA(0,78,66,1)
            HoverFill: =RGBA(0,98,84,1)
            PressedFill: =RGBA(0,62,52,1)
            BorderThickness: =0
            Color: =RGBA(255,255,255,1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            OnSelect: |-
              =With(
                  {recipients: Distinct(Filter(colMemberships, GroupName = varQuickPreviewTitle && !IsBlank(Trim(Email))), Email)},
                  If(
                      CountRows(recipients) = 0,
                      Notify("No member email addresses found for " & varQuickPreviewTitle & ".", NotificationType.Warning),
                      Copy(Concat(recipients, Value, "; "));
                      Notify("Copied " & CountRows(recipients) & " address" & If(CountRows(recipients) = 1, "", "es") & " from " & varQuickPreviewTitle & ".", NotificationType.Success)
                  )
              )
            X: =437
            Y: =632
            Width: =230
            Height: =44
      - btnMembersClose:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Close"
