            Text: ="Branch Contact Groups"
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =20
            Font: =Font.'Open Sans'
            X: =28
            Y: =10
            Width: =520
            Height: =32
      - lblHeaderSubQc:
          Control: Label@2.5.1
          Properties:
            Text: ="Quick copy contact lists"
