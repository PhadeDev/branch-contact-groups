                  Color: =RGBA(24,45,55,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Font: =Font.'Open Sans'
                  X: =4
                  Y: =6
                  Width: =470
                  Height: =22
            - lblMemberEmailQc:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Email & If(!IsBlank(Trim(ThisItem.Email)) && !IsApprovedAddress(ThisItem.Email), "   (other domain)", "")
                  Wrap: =false
                  Color: =If(!IsApprovedAddress(ThisItem.Email), RGBA(163,45,45,1), RGBA(96,105,103,1))
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =4
                  Y: =27
                  Width: =470
