      OnVisible: |-
        =Set(varQuickFilter, "All");
        Set(varQuickPreviewTitle, "");
        Set(varCustodianView, false);
        If(!varCacheReady && !varLoading, LoadCache())
    Children:
      - recHeaderQc:
          Control: Classic/Button@2.2.0
