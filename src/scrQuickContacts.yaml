                            idx: ThisItem.Value * 2 - 1
                        },
                        With({g: Index(source, idx)}, If(Len(g.Title) > 74, Left(g.Title, 74) & "...", g.Title))
                    )
                  Tooltip: |-
                    =With(
                        {
                            source: Sort(Filter(colGroups, (!Private || varIsMaintainer) && (IsBlank(Trim(txtQuickSearch.Text)) || Lower(Trim(txtQuickSearch.Text)) in Lower(Title)) && Switch(varQuickFilter, "OfficialUse", OfficialUseOnly, "Sensitive", OfficialSensitiveApproved, "Private", Private, true)), Title, SortOrder.Ascending),
