      - galQuickRows:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =With(
                  {
                      source: Sort(
                          Filter(
                              colGroups,
                              (!Private || varIsMaintainer) &&
                              (IsBlank(Trim(txtQuickSearch.Text)) || Lower(Trim(txtQuickSearch.Text)) in Lower(Title)) &&
                              Switch(
                                  varQuickFilter,
                                  "OfficialUse", OfficialUseOnly,
                                  "Sensitive", OfficialSensitiveApproved,
                                  "Private", Private,
                                  true
                              )
                          ),
                          Title,
                          SortOrder.Ascending
                      )
                  },
                  Sequence(RoundUp(CountRows(source) / 2, 0))
