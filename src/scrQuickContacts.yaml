            Height: =40
      - btnManageNavQc:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Manage Groups"
            Visible: =varIsMaintainer
            Fill: =RGBA(255,255,255,0.16)
            HoverFill: =RGBA(255,255,255,0.28)
            PressedFill: =RGBA(255,255,255,0.28)
            BorderColor: =RGBA(255,255,255,0.45)
            BorderThickness: =1
            Color: =RGBA(255,255,255,1)
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            OnSelect: =Navigate(scrManageGroups, ScreenTransition.Cover)
            X: =1160
            Y: =18
            Width: =160
            Height: =40
      - lblQuickHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Contact Lists"
            Color: =RGBA(24,45,55,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =36
            Y: =96
            Width: =360
            Height: =30
      - lblLoaded:
          Control: Label@2.5.1
          Properties:
            Text: ="Loaded " & Text(varLastMembershipRefresh, "[$-en-GB]d mmm HH:mm")
            Color: =RGBA(112,119,117,1)
            Size: =10
            Font: =Font.'Open Sans'
            Align: =Align.Right
            X: =1110
            Y: =102
            Width: =220
            Height: =20
      - btnRefreshQuick:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =If(varCacheReady, "Refresh", "Refreshing...")
            DisplayMode: =If(varCacheReady, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(255,255,255,1)
            HoverFill: =RGBA(232,237,235,1)
            PressedFill: =RGBA(222,229,226,1)
            BorderColor: =RGBA(190,201,197,1)
            BorderThickness: =1
            Color: =RGBA(45,58,64,1)
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =12
            OnSelect: =If(LoadCache(), Notify("Refreshed groups and memberships.", NotificationType.Success))
            X: =960
            Y: =94
            Width: =130
            Height: =36
      - txtQuickSearch:
          Control: ModernTextInput@1.1.2
          Properties:
            Placeholder: ="Search contact lists..."
            X: =36
            Y: =138
            Width: =510
            Height: =42
      - icoClearQuickSearch:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =!IsBlank(Trim(txtQuickSearch.Text))
            Color: =RGBA(128,135,133,1)
            Tooltip: ="Clear search"
            OnSelect: =Reset(txtQuickSearch)
            X: =508
            Y: =148
            Width: =22
            Height: =22
      - btnFilterAll:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="All"
            Fill: =If(varQuickFilter = "All", RGBA(0,78,66,1), RGBA(232,237,235,1))
            HoverFill: =If(varQuickFilter = "All", RGBA(0,78,66,1), RGBA(222,229,226,1))
            PressedFill: =Self.HoverFill
            Color: =If(varQuickFilter = "All", RGBA(255,255,255,1), RGBA(45,58,64,1))
            BorderThickness: =0
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(varQuickFilter, "All")
            X: =570
            Y: =140
            Width: =82
            Height: =36
      - btnFilterOfficial:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Official Use"
            Fill: =If(varQuickFilter = "OfficialUse", RGBA(0,78,66,1), RGBA(232,237,235,1))
            HoverFill: =If(varQuickFilter = "OfficialUse", RGBA(0,78,66,1), RGBA(222,229,226,1))
            PressedFill: =Self.HoverFill
            Color: =If(varQuickFilter = "OfficialUse", RGBA(255,255,255,1), RGBA(45,58,64,1))
            BorderThickness: =0
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(varQuickFilter, "OfficialUse")
            X: =660
            Y: =140
            Width: =130
            Height: =36
      - btnFilterSensitive:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Sensitive"
            Fill: =If(varQuickFilter = "Sensitive", RGBA(0,78,66,1), RGBA(232,237,235,1))
            HoverFill: =If(varQuickFilter = "Sensitive", RGBA(0,78,66,1), RGBA(222,229,226,1))
            PressedFill: =Self.HoverFill
            Color: =If(varQuickFilter = "Sensitive", RGBA(255,255,255,1), RGBA(45,58,64,1))
            BorderThickness: =0
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(varQuickFilter, "Sensitive")
            X: =798
            Y: =140
            Width: =116
            Height: =36
      - btnFilterPrivate:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Private"
            Visible: =varIsMaintainer
            Fill: =If(varQuickFilter = "Private", RGBA(0,78,66,1), RGBA(232,237,235,1))
            HoverFill: =If(varQuickFilter = "Private", RGBA(0,78,66,1), RGBA(222,229,226,1))
            PressedFill: =Self.HoverFill
            Color: =If(varQuickFilter = "Private", RGBA(255,255,255,1), RGBA(45,58,64,1))
            BorderThickness: =0
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(varQuickFilter, "Private")
            X: =922
            Y: =140
            Width: =104
            Height: =36
      - galQuickRows:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =With(
                  {searchText: Lower(Trim(txtQuickSearch.Text))},
                  Sort(
                      Filter(
                          colGroups,
                          (!Private || varIsMaintainer) &&
                          (IsBlank(searchText) || searchText in Lower(Title)) &&
                          Switch(
                              varQuickFilter,
                              "OfficialUse", OfficialUseOnly,
                              "Sensitive", OfficialSensitiveApproved,
                              "Private", Private,
                              true
                          )
                      ),
                      Title,
                      SortOrder.Ascending
                  )
              )
            TemplateSize: =104
            TemplatePadding: =0
            X: =36
            Y: =198
            Width: =1294
            Height: =540
          Children:
            - recCard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(255,255,255,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderColor: =RGBA(220,228,225,1)
                  BorderThickness: =1
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  X: =0
                  Y: =0
                  Width: =1294
                  Height: =92
            - btnTile:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =With(
                        {w: Split(Trim(ThisItem.Title), " ")},
                        Upper(Left(First(w).Value, 1) & If(CountRows(w) > 1, Left(Index(w, 2).Value, 1), ""))
                    )
                  DisplayMode: =DisplayMode.View
                  Fill: =If(ThisItem.Private, RGBA(232,237,235,1), RGBA(225,239,235,1))
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  Color: =RGBA(0,78,66,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Size: =16
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  X: =20
                  Y: =22
                  Width: =48
                  Height: =48
            - lblTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =If(Len(ThisItem.Title) > 80, Left(ThisItem.Title, 80) & "...", ThisItem.Title)
                  Tooltip: =ThisItem.Title
                  Wrap: =false
                  Color: =RGBA(24,45,55,1)
                  FontWeight: =FontWeight.Bold
                  Size: =15
                  Font: =Font.'Open Sans'
                  X: =84
                  Y: =12
                  Width: =820
                  Height: =26
            - lblMeta:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =With(
                        {n: CountRows(Filter(colMemberships, GroupName = ThisItem.Title && (Coalesce(ThisItem.HasCustodians, false) || !IsBlank(Trim(Email)))))},
                        n & " member" & If(n = 1, "", "s") & "  |  Last modified " & Text(Coalesce(ThisItem.ManuallySetModified, ThisItem.Modified), "d mmm yyyy") & If(Coalesce(ThisItem.HasCustodians, false), "  |  Email addresses withheld", "")
                    )
                  Color: =RGBA(96,105,103,1)
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =84
                  Y: =38
                  Width: =620
                  Height: =20
            - pilSensitiveQc:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Official Sensitive Approved"
                  DisplayMode: =DisplayMode.View
                  Visible: =ThisItem.OfficialSensitiveApproved
                  Fill: =RGBA(252,231,231,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  Color: =RGBA(163,45,45,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  X: =84
                  Y: =62
                  Width: =176
                  Height: =20
            - pilOfficial:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Official Use Only"
                  DisplayMode: =DisplayMode.View
                  Visible: =ThisItem.OfficialUseOnly
                  Fill: =RGBA(225,239,235,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  Color: =RGBA(0,78,66,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  X: =84 + If(ThisItem.OfficialSensitiveApproved, 184, 0)
                  Y: =62
                  Width: =128
                  Height: =20
            - pilPrivateQc:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Private"
                  DisplayMode: =DisplayMode.View
                  Visible: =varIsMaintainer && ThisItem.Private
                  Fill: =RGBA(232,237,235,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  Color: =RGBA(45,58,64,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  X: =84 + If(ThisItem.OfficialSensitiveApproved, 184, 0) + If(ThisItem.OfficialUseOnly, 136, 0)
                  Y: =62
                  Width: =78
                  Height: =20
            - btnMembers:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Who's in it"
                  Fill: =RGBA(255,255,255,1)
                  HoverFill: =RGBA(225,239,235,1)
                  PressedFill: =RGBA(210,230,224,1)
                  BorderColor: =RGBA(0,78,66,1)
                  BorderThickness: =1
                  Color: =RGBA(0,78,66,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  Tooltip: ="See who is in this list before you copy it"
                  OnSelect: |-
                    =Set(varQuickPreviewTitle, ThisItem.Title);
                    Set(varCustodianView, Coalesce(ThisItem.HasCustodians, false));
                    ClearCollect(colCustodianView, ForAll(Filter(Split(If(Coalesce(ThisItem.HasCustodians, false), Coalesce(ThisItem.CustodianEmails, ""), ""), ";"), !IsBlank(Trim(Value))) As c, {Email: Trim(c.Value), Name: IfError(Office365Users.UserProfileV2(Trim(c.Value)).displayName, Trim(c.Value))}))
                  X: =916
                  Y: =26
                  Width: =170
                  Height: =40
            - btnCopy:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Copy addresses"
                  Visible: =!Coalesce(ThisItem.HasCustodians, false)
                  Fill: =RGBA(0,78,66,1)
                  HoverFill: =RGBA(0,98,84,1)
                  PressedFill: =RGBA(0,62,52,1)
                  BorderThickness: =0
                  Color: =RGBA(255,255,255,1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  OnSelect: |-
                    =With(
                        {recipients: Distinct(Filter(colMemberships, GroupName = ThisItem.Title && !IsBlank(Trim(Email))), Email)},
                        If(
                            CountRows(recipients) = 0,
                            Notify("No member email addresses found for " & ThisItem.Title & ".", NotificationType.Warning),
                            Copy(Concat(recipients, Value, "; "));
                            Notify("Copied " & CountRows(recipients) & " address" & If(CountRows(recipients) = 1, "", "es") & " from " & ThisItem.Title & ".", NotificationType.Success)
                        )
                    )
                  X: =1106
                  Y: =26
                  Width: =164
                  Height: =40
            - recClick:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0,0,0,0)
                  HoverFill: =RGBA(0,78,66,0.04)
                  PressedFill: =RGBA(0,78,66,0.08)
                  BorderThickness: =0
                  Tooltip: ="See who is in this list"
                  OnSelect: |-
                    =Set(varQuickPreviewTitle, ThisItem.Title);
                    Set(varCustodianView, Coalesce(ThisItem.HasCustodians, false));
                    ClearCollect(colCustodianView, ForAll(Filter(Split(If(Coalesce(ThisItem.HasCustodians, false), Coalesce(ThisItem.CustodianEmails, ""), ""), ";"), !IsBlank(Trim(Value))) As c, {Email: Trim(c.Value), Name: IfError(Office365Users.UserProfileV2(Trim(c.Value)).displayName, Trim(c.Value))}))
                  X: =0
                  Y: =0
                  Width: =904
                  Height: =92
      - lblNoQuickResults:
          Control: Label@2.5.1
          Properties:
