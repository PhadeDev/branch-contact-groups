            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            X: =413
            Y: =70
            Width: =540
            Height: =628
      - lblMembersTitle:
          Control: Label@2.5.1
          Properties:
            Text: =varQuickPreviewTitle
            Visible: =!IsBlank(varQuickPreviewTitle)
            Color: =RGBA(24,45,55,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =437
            Y: =90
            Width: =450
            Height: =32
      - icoMembersClose:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =!IsBlank(varQuickPreviewTitle)
            Color: =RGBA(96,105,103,1)
            Tooltip: ="Close"
            OnSelect: =Set(varQuickPreviewTitle, "")
            X: =905
            Y: =94
            Width: =24
            Height: =24
      - lblMembersSub:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {n: CountRows(Filter(colMemberships, GroupName = varQuickPreviewTitle && (varCustodianView || !IsBlank(Trim(Email)))))},
                  n & " member" & If(n = 1, "", "s") & If(varCustodianView, " listed.", ". Check these are the right people, then copy the addresses.")
              )
            Visible: =!IsBlank(varQuickPreviewTitle)
            Color: =RGBA(96,105,103,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =437
            Y: =124
            Width: =492
            Height: =40
      - lblCustodianNoteQuick:
          Control: Label@2.5.1
          Properties:
            Text: ="The email addresses of members within this contact group have been withheld for privacy or sensitivity reasons. If you wish to contact any of the individuals listed below, please contact one of the designated custodians."
            Visible: =!IsBlank(varQuickPreviewTitle) && varCustodianView
            Fill: =RGBA(255,243,205,1)
            Color: =RGBA(95,60,0,1)
            Size: =12
            Font: =Font.'Open Sans'
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =6
            PaddingBottom: =6
            X: =437
            Y: =168
            Width: =492
            Height: =92
      - galCustodiansQuick:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colCustodianView
            Visible: =!IsBlank(varQuickPreviewTitle) && varCustodianView
            TemplateSize: =58
            TemplatePadding: =0
            X: =437
            Y: =266
            Width: =492
            Height: =120
          Children:
            - galCustodiansQuickAvatar:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =Upper(Left(ThisItem.Name, 1))
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(0,78,66,1)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  Color: =RGBA(255,255,255,1)
                  BorderThickness: =0
                  RadiusTopLeft: =22
                  RadiusTopRight: =22
                  RadiusBottomLeft: =22
                  RadiusBottomRight: =22
                  X: =4
                  Y: =5
                  Width: =44
                  Height: =44
            - galCustodiansQuickPhoto:
                Control: Image@2.2.3
                Properties:
                  Image: =If(IsBlank(Trim(ThisItem.Email)), Blank(), IfError(Office365Users.UserPhotoV2(Trim(ThisItem.Email)), Blank()))
                  RadiusTopLeft: =22
                  RadiusTopRight: =22
                  RadiusBottomLeft: =22
                  RadiusBottomRight: =22
                  X: =4
                  Y: =5
                  Width: =44
                  Height: =44
            - galCustodiansQuickName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Name
                  Wrap: =false
                  Color: =RGBA(24,45,55,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Font: =Font.'Open Sans'
                  X: =60
                  Y: =6
                  Width: =422
                  Height: =22
            - galCustodiansQuickMail:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Email
                  Wrap: =false
                  Color: =RGBA(96,105,103,1)
                  Size: =12
                  Font: =Font.'Open Sans'
                  X: =60
                  Y: =28
                  Width: =422
                  Height: =20
      - galMembersQc:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =Sort(
                  Filter(colMemberships, GroupName = varQuickPreviewTitle && (varCustodianView || !IsBlank(Trim(Email)))),
                  If(IsBlank(Trim(Name)), Email, Name),
                  SortOrder.Ascending
              )
            Visible: =!IsBlank(varQuickPreviewTitle)
            TemplateSize: =54
