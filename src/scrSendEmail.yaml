          Children:
            - lblSavedSelectionRow:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Value & "  -  " & CountRows(Filter(colSavedSelections, SelectionName = ThisItem.Value)) & " group(s)"
                  Color: =RGBA(31,58,95,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Font: =Font.'Open Sans'
                  X: =0
                  Y: =8
                  Width: =360
                  Height: =24
            - btnLoadSavedSelection:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Load"
                  BasePaletteColor: =RGBA(0,78,66,1)
                  OnSelect: |-
                    =UpdateIf(colGroups, true, {Ticked: false});
                    ForAll(Filter(colSavedSelections, SelectionName = ThisItem.Value) As saved, UpdateIf(colGroups, Lower(Trim(Title)) = Lower(Trim(saved.GroupName)), {Ticked: true}));
                    Set(varBccForcedByBatch, false);
                    Set(varBccForced, CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, grp.Ticked = true && Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) > 0 && !EndsWith(Lower(mem.Email), "@" & varModDomain))) > 0);
                    Set(varShowLightbox, false);
                    Notify("Loaded '" & ThisItem.Value & "'.", NotificationType.Success)
                  X: =390
                  Y: =7
                  Width: =110
                  Height: =36
            - btnDeleteSavedSelection:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Delete"
                  BasePaletteColor: =RGBA(163,45,45,1)
                  OnSelect: |-
                    =RemoveIf('BM Saved Selections', SelectionName = ThisItem.Value);
                    ClearCollect(colSavedSelections, 'BM Saved Selections');
                    Notify("Deleted '" & ThisItem.Value & "'.", NotificationType.Error)
