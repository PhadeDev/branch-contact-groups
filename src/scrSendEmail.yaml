                  "batch1", Sort(AddColumns(GroupBy(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, Lower(Trim(grp.ThursdayBatch.Value)) = "batch 1" && Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) > 0), Email, GroupedRows), Name, First(GroupedRows).Name), Name, SortOrder.Ascending),
