      - txtSavedSelectionName:
          Control: ModernTextInput@1.1.0
          Properties:
            Placeholder: ="Selection name"
            Visible: =varShowLightbox && varLightboxMode = "saved"
            OnChange: =Set(varSavedSelectionName, Trim(txtSavedSelectionName.Text))
            X: =363
            Y: =160
            Width: =430
            Height: =42
      - btnSaveSelection:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save current selection"
            Visible: =varShowLightbox && varLightboxMode = "saved"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varSavedSelectionName, Trim(txtSavedSelectionName.Text));
              If(
                  IsBlank(varSavedSelectionName),
                  Notify("Enter a selection name first.", NotificationType.Warning),
                  CountRows(Filter(colGroups, Ticked = true)) = 0,
                  Notify("Tick at least one group before saving.", NotificationType.Warning),
                  RemoveIf('BM Saved Selections', Lower(Trim(SelectionName)) = Lower(Trim(varSavedSelectionName)));
                  ForAll(Filter(colGroups, Ticked = true) As grp, Patch('BM Saved Selections', Defaults('BM Saved Selections'), {Title: varSavedSelectionName & " - " & grp.Title, SelectionName: varSavedSelectionName, GroupName: grp.Title}));
                  ClearCollect(colSavedSelections, 'BM Saved Selections');
                  Reset(txtSavedSelectionName);
                  Notify("Saved selection '" & varSavedSelectionName & "'.", NotificationType.Success)
              )
            X: =803
            Y: =160
            Width: =200
            Height: =42
      - lblSavedSelectionHint:
          Control: Label@2.5.1
          Properties:
            Text: ="Load a saved set below, or tick groups first and save them as a reusable set."
            Visible: =varShowLightbox && varLightboxMode = "saved"
            Color: =RGBA(120,120,120,1)
