                  Width: =700
                  Height: =82
            - recCheckBox:
                Control: ModernCheckbox@1.0.2
                Properties:
                  BasePaletteColor: =RGBA(156, 220, 79, 1)
                  CheckboxSize: =22
                  Default: =ThisItem.Ticked
                  Label: =""
                  OnCheck: |-
                    =Patch(colGroups, ThisItem, {Ticked: true});
                    Set(varBccForcedByBatch, false);
                    Set(varBccForced, CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, grp.Ticked = true && Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) > 0 && !IsBlank(Trim(mem.Email)) && !IsApprovedAddress(mem.Email))) > 0 || varBccForcedByBatch)
                  OnUncheck: |-
                    =Patch(colGroups, ThisItem, {Ticked: false});
                    Set(varBccForcedByBatch, false);
                    Set(varBccForced, CountRows(Filter(colMemberships As mem, CountRows(Filter(colGroups As grp, grp.Ticked = true && Lower(Trim(grp.Title)) = Lower(Trim(mem.GroupName)))) > 0 && !IsBlank(Trim(mem.Email)) && !IsApprovedAddress(mem.Email))) > 0 || varBccForcedByBatch)
