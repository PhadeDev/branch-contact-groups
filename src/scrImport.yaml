Screens:
  scrImport:
    Properties:
      Fill: =RGBA(246,248,247,1)
      OnVisible: |-
        =If(
            !varIsMaintainer,
            Back(),
            Set(varImpMode, "add");
            Set(varImpArmed, false);
            Set(varImpBusy, false);
            ClearCollect(colImpParsed, Filter(Table({Tag: "", Email: "", Name: ""}), false));
            ClearCollect(colImpClean, AddColumns(GroupBy(Filter(colImpParsed, false), Tag, Email, Rows), Name, First(Rows).Name, Dups, CountRows(Rows) - 1));
            ClearCollect(colImpTags, Filter(Table({Tag: "", N: 0}), false));
            ClearCollect(colImpResults, Filter(Table({Group: "", Added: 0, Updated: 0, Removed: 0}), false))
        )
    Children:
      - recHeader:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(0,78,66,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =1366
            Height: =72
      - icoBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(255,255,255,1)
            Tooltip: ="Back"
            OnSelect: =Back()
            X: =16
            Y: =24
            Width: =24
            Height: =24
      - lblHeaderTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Import from paste"
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =20
            Font: =Font.'Open Sans'
            X: =52
            Y: =10
            Width: =600
            Height: =32
      - lblHeaderSub:
          Control: Label@2.5.1
          Properties:
            Text: ="Create or update contact groups from a pasted list of names and email addresses"
            Color: =RGBA(214,232,227,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =52
            Y: =44
            Width: =800
            Height: =22
      - lblImpStep1:
          Control: Label@2.5.1
          Properties:
            Text: ="1. Paste your list"
            Color: =RGBA(0,78,66,1)
            FontWeight: =FontWeight.Bold
            Size: =16
            Font: =Font.'Open Sans'
            X: =20
            Y: =88
            Width: =560
            Height: =26
      - lblImpHelp:
          Control: Label@2.5.1
          Properties:
            Text: ="Paste straight from Outlook or Excel. A line ending in a colon (for example NAL:) starts a new list. Each entry is a name followed by an email address, separated by semicolons or new lines."
            Color: =RGBA(96,105,103,1)
            Size: =11
            Font: =Font.'Open Sans'
            X: =20
            Y: =116
            Width: =560
            Height: =54
      - txtImportPaste:
          Control: Classic/TextInput@2.3.2
          Properties:
            HintText: ="Paste your list here"
            Mode: =TextMode.MultiLine
            Font: =Font.'Open Sans'
            Size: =12
            BorderColor: =RGBA(190,201,197,1)
            HoverBorderColor: =RGBA(0,78,66,1)
            PressedBorderColor: =RGBA(0,78,66,1)
            FocusedBorderColor: =RGBA(0,78,66,1)
            X: =20
            Y: =176
            Width: =560
            Height: =280
      - btnImpCheck:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Check paste"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varImpArmed, false);
              Clear(colImpResults);
              With(
                  {
                      lines: With(
                          {raw: Split(Substitute(Substitute(txtImportPaste.Text, Char(13), ""), Char(160), " "), Char(10))},
                          ForAll(Sequence(CountRows(raw)) As s, {Idx: s.Value, Line: Trim(Index(raw, s.Value).Value)})
                      )
                  },
                  With(
                      {
                          heads: ForAll(
                              Filter(lines, !IsBlank(Line) && Right(Line, 1) = ":" && !("@" in Line) && Len(Line) <= 40) As h,
                              {HIdx: h.Idx, Tag: Trim(Left(h.Line, Len(h.Line) - 1))}
                          )
                      },
                      ClearCollect(
                          colImpParsed,
                          ForAll(
                              Ungroup(
                                  ForAll(
                                      Filter(lines, !IsBlank(Line) && !(Right(Line, 1) = ":" && !("@" in Line) && Len(Line) <= 40)) As ln,
                                      {
                                          Tag: If(CountRows(Filter(heads, HIdx < ln.Idx)) = 0, "Pasted list", Last(Filter(heads, HIdx < ln.Idx)).Tag),
                                          Segs: Filter(Split(ln.Line, ";"), !IsBlank(Trim(Value)))
                                      }
                                  ),
                                  Segs
                              ) As sg,
                              With(
                                  {seg: Trim(sg.Value), em: Last(MatchAll(Trim(sg.Value), "[A-Za-z0-9._%+'\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}")).FullMatch},
                                  {
                                      Tag: sg.Tag,
                                      Email: Lower(em),
                                      Name: If(IsBlank(em), seg, Coalesce(Trim(Substitute(Substitute(Substitute(Substitute(seg, em, ""), "<>", ""), "()", ""), Char(34), "")), em))
                                  }
                              )
                          )
                      )
                  )
              );
              ClearCollect(colImpClean, AddColumns(GroupBy(Filter(colImpParsed, !IsBlank(Email)), Tag, Email, Rows), Name, First(Rows).Name, Dups, CountRows(Rows) - 1));
              ClearCollect(colImpTags, ForAll(Distinct(colImpClean, Tag) As t, {Tag: t.Value, N: CountRows(Filter(colImpClean, Tag = t.Value))}));
              Reset(txtImpTitle1);
              Reset(txtImpTitle2);
              Reset(txtImpTitle3);
              Reset(txtImpTitle4);
              Reset(txtImpTitle5);
              Reset(txtImpTitle6);
              If(CountRows(colImpClean) = 0, Notify("No email addresses were found in that paste.", NotificationType.Warning))
            X: =20
            Y: =470
            Width: =170
            Height: =42
      - btnImpClear:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Clear"
            Fill: =RGBA(255,255,255,1)
            HoverFill: =RGBA(232,237,235,1)
            PressedFill: =RGBA(222,229,226,1)
            BorderColor: =RGBA(190,201,197,1)
            BorderThickness: =1
            Color: =RGBA(45,58,64,1)
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            OnSelect: |-
              =Reset(txtImportPaste);
              Clear(colImpParsed);
              Clear(colImpClean);
              Clear(colImpTags);
              Clear(colImpResults);
              Set(varImpArmed, false);
              Reset(txtImpTitle1);
              Reset(txtImpTitle2);
              Reset(txtImpTitle3);
              Reset(txtImpTitle4);
              Reset(txtImpTitle5);
              Reset(txtImpTitle6)
            X: =204
            Y: =470
            Width: =110
            Height: =42
      - lblImpSummary:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(
                  CountRows(colImpParsed) = 0,
                  "Nothing checked yet. Paste your list, then press Check paste.",
                  With(
                      {
                          found: CountRows(colImpClean),
                          lists: CountRows(colImpTags),
                          skipped: CountRows(Filter(colImpParsed, IsBlank(Email))),
                          dupes: CountRows(Filter(colImpParsed, !IsBlank(Email))) - CountRows(colImpClean),
                          other: CountRows(Filter(colImpClean, !IsApprovedAddress(Email)))
                      },
                      found & " address" & If(found = 1, "", "es") & " found in " & lists & " list" & If(lists = 1, "", "s") & "." &
                      If(dupes > 0, "  " & dupes & " repeated address" & If(dupes = 1, "", "es") & " ignored.", "") &
                      If(skipped > 0, "  " & skipped & " entr" & If(skipped = 1, "y", "ies") & " had no email address.", "") &
                      If(other > 0, "  " & other & " are not on an approved domain (they are still imported).", "")
                  )
              )
            Color: =RGBA(24,45,55,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =20
            Y: =522
            Width: =560
            Height: =64
