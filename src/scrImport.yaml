      - btnImpGo:
          Control: ModernButton@1.0.0
          Properties:
            Text: =If(varImpBusy, "Importing... please wait", If(varImpMode = "replace" && varImpArmed, "Tap again to confirm replace", "Import now"))
            BasePaletteColor: =If(varImpMode = "replace", RGBA(163,45,45,1), RGBA(0,78,66,1))
            DisplayMode: =If(varImpBusy || CountRows(colImpClean) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Notify("Import button pressed.", NotificationType.Information);
              With(
                  {
                      titled: CountRows(Filter(Sequence(CountRows(colImpTags)) As q, q.Value <= 6 && !IsBlank(Switch(q.Value, 1, Trim(txtImpTitle1.Text), 2, Trim(txtImpTitle2.Text), 3, Trim(txtImpTitle3.Text), 4, Trim(txtImpTitle4.Text), 5, Trim(txtImpTitle5.Text), 6, Trim(txtImpTitle6.Text))))),
                      titles: Filter(ForAll(Sequence(CountRows(colImpTags)) As q, {T: Lower(Switch(q.Value, 1, Trim(txtImpTitle1.Text), 2, Trim(txtImpTitle2.Text), 3, Trim(txtImpTitle3.Text), 4, Trim(txtImpTitle4.Text), 5, Trim(txtImpTitle5.Text), 6, Trim(txtImpTitle6.Text)))}), !IsBlank(T))
                  },
                  If(
                      varImpBusy,
                      Blank(),
                      CountRows(colImpClean) = 0,
                      Notify("Check a paste first.", NotificationType.Warning),
                      titled = 0,
                      Notify("Type a group name for at least one list.", NotificationType.Warning),
                      CountRows(titles) <> CountRows(Distinct(titles, T)),
                      Notify("Two lists have the same group name. Give each list its own name.", NotificationType.Warning),
                      varImpMode = "replace" && !varImpArmed,
                      Set(varImpArmed, true),
                      Set(varImpBusy, true);
                      Notify("Import started. Keep this screen open until the green message appears.", NotificationType.Information);
                      IfError(
                      Clear(colImpResults);
                      ForAll(
                          Sequence(CountRows(colImpTags)) As s,
                          With(
                              {title: Trim(Switch(s.Value, 1, Trim(txtImpTitle1.Text), 2, Trim(txtImpTitle2.Text), 3, Trim(txtImpTitle3.Text), 4, Trim(txtImpTitle4.Text), 5, Trim(txtImpTitle5.Text), 6, Trim(txtImpTitle6.Text)))},
                              If(
                                  s.Value <= 6 && !IsBlank(title) && CountRows(Filter(colGroups, Lower(Trim(Title)) = Lower(title))) = 0,
                                  Patch('BM Groups', Defaults('BM Groups'), {Title: title, ThursdayBatch: {Value: "None"}, Private: false, OfficialSensitiveApproved: false, OfficialUseOnly: false});
                                  Patch('BM History', Defaults('BM History'), {Title: "Group created via import", GroupName: title, EventType: {Value: "Created"}})
                              )
                          )
                      );
                      ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
                      ForAll(
                          Sequence(CountRows(colImpTags)) As s,
                          With(
                              {
                                  tag: Index(colImpTags, s.Value).Tag,
                                  typed: Trim(Switch(s.Value, 1, Trim(txtImpTitle1.Text), 2, Trim(txtImpTitle2.Text), 3, Trim(txtImpTitle3.Text), 4, Trim(txtImpTitle4.Text), 5, Trim(txtImpTitle5.Text), 6, Trim(txtImpTitle6.Text)))
                              },
                              If(
                                  s.Value <= 6 && !IsBlank(typed),
                                  With(
                                      {gTitle: Coalesce(LookUp(colGroups, Lower(Trim(Title)) = Lower(typed)).Title, typed)},
                                      With(
                                          {
                                              ents: Filter(colImpClean, Tag = tag),
                                              cur: AddColumns(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(gTitle)), NameKey, Lower(Trim(Name)))
                                          },
                                          With(
                                              {
                                                  toAdd: Filter(ents, !(Email in cur.Email) && !(varImpMode = "update" && Lower(Trim(Name)) in cur.NameKey)),
                                                  toUpd: If(varImpMode = "update", Filter(ents, !(Email in cur.Email) && Lower(Trim(Name)) in cur.NameKey), Filter(ents, false)),
                                                  toRem: If(varImpMode = "replace", Filter(cur, !(Email in ents.Email)), Filter(cur, false))
                                              },
                                              Collect(colImpResults, {Group: gTitle, Added: CountRows(toAdd), Updated: CountRows(toUpd), Removed: CountRows(toRem)});
                                              ForAll(
                                                  toRem As r,
                                                  Remove('BM Memberships', LookUp('BM Memberships', ID = r.ID));
                                                  RemoveIf(colMemberships, ID = r.ID)
                                              );
                                              ForAll(
                                                  toUpd As e,
                                                  With(
                                                      {m: LookUp(cur, NameKey = Lower(Trim(e.Name)))},
                                                      Patch('BM Memberships', LookUp('BM Memberships', ID = m.ID), {Email: e.Email});
                                                      UpdateIf(colMemberships, ID = m.ID, {Email: e.Email})
                                                  )
                                              );
                                              ForAll(
                                                  toAdd As e,
                                                  Collect(colMemberships, Patch('BM Memberships', Defaults('BM Memberships'), {Title: e.Name, Name: e.Name, Email: e.Email, GroupName: gTitle}))
                                              );
                                              Patch('BM History', Defaults('BM History'), {Title: "Import via paste: " & CountRows(toAdd) & " added, " & CountRows(toUpd) & " updated, " & CountRows(toRem) & " removed", GroupName: gTitle, EventType: {Value: Switch(varImpMode, "replace", "Replaced", "update", "Edited", "Added")}});
                                              Patch('BM Groups', LookUp('BM Groups', Title = gTitle), {Title: gTitle})
                                          )
                                      )
                                  )
                              )
                          )
                      );
                      Clear(colImpParsed);
                      Clear(colImpClean);
                      Clear(colImpTags);
                      Reset(txtImportPaste);
                      Notify("Import finished for " & CountRows(colImpResults) & " group" & If(CountRows(colImpResults) = 1, "", "s") & ".", NotificationType.Success),
                      Notify("Import stopped: " & FirstError.Message & " Some rows may already be saved, so check the group before trying again.", NotificationType.Error)
                      );
                      Set(varImpBusy, false);
                      Set(varImpArmed, false)
                  )
              )
            X: =610
            Y: =650
            Width: =300
            Height: =46
      - lblImpResult:
          Control: Label@2.5.1
