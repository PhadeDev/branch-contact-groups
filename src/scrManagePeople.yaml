Screens:
  scrManagePeople:
    Properties:
      Fill: =RGBA(255,255,255,1)
      OnVisible: |-
        =If(
            !varIsMaintainer,
            Back(),
            ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
            ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
            ClearCollect(colPeople, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows)));
            Set(varSelectedPersonEmail, Blank());
            Set(varAddPersonNamePrefill, "");
            Set(varAddPersonEmailPrefill, "");
            Set(varConfirmPurgeArmed, false);
            Set(varShowLightbox, false);
            Set(varPeopleLightboxMode, "addPerson");
            ClearCollect(colPersonGroupPicks, Filter(colGroups, false));
            ClearCollect(colAddPersonPicks, AddColumns(colGroups, Picked, false));
            ClearCollect(colAddPersonGalResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
            Set(varLastMembershipRefresh, Now())
        )
    Children:
      - recHeader:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(0,78,66,1)
            HoverFill: =RGBA(0,78,66,1)
            PressedFill: =RGBA(0,78,66,1)
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =1366
            Height: =72
      - lblAppVersion:
          Control: Label@2.5.1
          Properties:
            Text: ="scrManagePeople v2.25"
            Color: =RGBA(214,232,227,1)
            Size: =9
            Font: =Font.'Open Sans'
            X: =1226
            Y: =3
            Width: =130
            Height: =12
      - icoBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(230,241,251,1)
            OnSelect: =Back()
            X: =16
            Y: =24
            Width: =24
            Height: =24
      - lblHeaderTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Manage People"
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Font: =Font.'Open Sans'
            X: =52
            Y: =10
            Width: =600
            Height: =32
      - lblHeaderSub:
          Control: Label@2.5.1
          Properties:
            Text: ="One record per person - tick the groups they belong to"
            Color: =RGBA(214,232,227,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =52
            Y: =44
            Width: =600
            Height: =22
      - btnAddPersonTrigger:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="+ Add Person"
            BasePaletteColor: =RGBA(46,110,145,1)
            OnSelect: |-
              =Set(varPeopleLightboxMode, "addPerson");
              ClearCollect(colAddPersonPicks, AddColumns(colGroups, Picked, false));
              Set(varAddPersonNamePrefill, "");
              Set(varAddPersonEmailPrefill, "");
              Reset(txtAddPersonSearch);
              Reset(txtAddPersonName);
              Reset(txtAddPersonEmail);
              ClearCollect(colAddPersonGalResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
              Set(varShowLightbox, true)
            X: =1000
            Y: =16
            Width: =160
            Height: =40
      - btnPurgeTrigger:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Remove Leaver"
            BasePaletteColor: =RGBA(163,45,45,1)
            OnSelect: |-
              =Set(varPeopleLightboxMode, "purge");
              Reset(txtPurgeSearch);
              Set(varConfirmPurgeArmed, false);
              Set(varShowLightbox, true)
            X: =1180
            Y: =16
            Width: =160
            Height: =40
      - btnRefreshPeopleData:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Refresh"
            BasePaletteColor: =RGBA(120,120,120,1)
            OnSelect: |-
              =ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));
              ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
              ClearCollect(colPeople, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows)));
              Set(varLastMembershipRefresh, Now());
              Notify("Refreshed people and memberships.", NotificationType.Success)
            X: =820
            Y: =16
            Width: =160
            Height: =40
      - lblPeopleLastRefresh:
          Control: Label@2.5.1
          Properties:
            Text: ="Loaded " & Text(varLastMembershipRefresh, "[$-en-GB]d mmm HH:mm")
            Color: =RGBA(120,120,120,1)
            Size: =10
            Font: =Font.'Open Sans'
            X: =660
            Y: =138
            Width: =200
            Height: =20
      - lblAllPeopleHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="All People"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =16
            Font: =Font.'Open Sans'
            X: =20
            Y: =88
            Width: =400
            Height: =26
      - txtPeopleSearch:
          Control: ModernTextInput@1.1.0
          Properties:
            Placeholder: ="Search people by name or email..."
            X: =20
            Y: =126
            Width: =620
            Height: =44
      - icoClearPeopleSearch:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =!IsBlank(Trim(txtPeopleSearch.Text))
            Color: =RGBA(160,160,160,1)
            Tooltip: ="Clear search"
            OnSelect: =Reset(txtPeopleSearch)
            X: =588
            Y: =137
            Width: =22
            Height: =22
      - galPeopleList:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =Sort(
                  Filter(colPeople, IsBlank(Trim(txtPeopleSearch.Text)) || txtPeopleSearch.Text in Name || txtPeopleSearch.Text in Email),
                  Name,
                  SortOrder.Ascending
              )
            TemplateSize: =92
            TemplatePadding: =0
            X: =20
            Y: =180
            Width: =1320
            Height: =540
          Children:
            - recPersonRowFrame:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =If(Lower(ThisItem.Email) = Lower(varSelectedPersonEmail), RGBA(234,243,225,1), RGBA(255,255,255,1))
                  HoverFill: =RGBA(233,241,246,1)
                  PressedFill: =RGBA(233,241,246,1)
                  BorderColor: =RGBA(221,227,234,1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  X: =0
                  Y: =0
                  Width: =1320
                  Height: =86
            - lblPersonRowJMC:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.JMC
                  Visible: =!IsBlank(Trim(ThisItem.JMC))
                  Wrap: =false
                  Color: =RGBA(107,79,160,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =16
                  Y: =4
                  Width: =1280
                  Height: =18
            - lblPersonRowCounty:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.County
                  Visible: =!IsBlank(Trim(ThisItem.County))
                  Wrap: =false
                  Color: =RGBA(120,120,120,1)
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =16
                  Y: =4 + If(IsBlank(Trim(ThisItem.JMC)), 0, 18)
                  Width: =1280
                  Height: =18
            - lblPersonRowName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Name
                  Wrap: =false
                  Color: =RGBA(31,58,95,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Font: =Font.'Open Sans'
                  X: =16
                  Y: =4 + If(IsBlank(Trim(ThisItem.JMC)), 0, 18) + If(IsBlank(Trim(ThisItem.County)), 0, 18)
                  Width: =1280
                  Height: =22
            - lblPersonRowEmail:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Email & "  ·  member of " & ThisItem.GroupCount & " group" & If(ThisItem.GroupCount = 1, "", "s")
                  Wrap: =false
                  Color: =RGBA(120,120,120,1)
                  Size: =12
                  Font: =Font.'Open Sans'
                  X: =16
                  Y: =26 + If(IsBlank(Trim(ThisItem.JMC)), 0, 18) + If(IsBlank(Trim(ThisItem.County)), 0, 18)
                  Width: =1280
                  Height: =20
            - recPersonRowClickCatcher:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0,0,0,0)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  OnSelect: |-
                    =Set(varSelectedPersonEmail, ThisItem.Email);
                    Set(varPeopleLightboxMode, "editPerson");
                    With(
                        {personEmail: ThisItem.Email},
                        ClearCollect(
                            colPersonGroupPicks,
                            Sort(
                                Sort(
                                    AddColumns(
                                        colGroups As grp,
                                        Picked,
                                        CountRows(
                                            Filter(
                                                colMemberships As mem,
                                                Lower(Trim(mem.GroupName)) = Lower(Trim(grp.Title)) && Lower(mem.Email) = Lower(personEmail)
                                            )
                                        ) > 0
                                    ),
                                    Title,
                                    SortOrder.Ascending
                                ),
                                Picked,
                                SortOrder.Descending
                            )
                        )
                    );
                    Reset(txtPersonName);
                    Reset(txtPersonEmail);
                    Set(varShowLightbox, true)
                  X: =0
                  Y: =0
                  Width: =1320
                  Height: =66
      - recLightboxBackdrop:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Visible: =varShowLightbox
            Fill: =RGBA(15,25,20,0.45)
