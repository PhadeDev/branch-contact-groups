            Width: =400
            Height: =22
      - txtAddPersonSearch:
          Control: ModernTextInput@1.1.0
          Properties:
            Placeholder: ="Search by name..."
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            OnChange: |-
              =If(
                  IsBlank(Trim(txtAddPersonSearch.Text)),
                  ClearCollect(colAddPersonGalResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false)),
                  ClearCollect(colAddPersonGalResults, Office365Users.SearchUserV2({searchTerm: txtAddPersonSearch.Text, top: 5}).value)
              )
            X: =263
            Y: =148
            Width: =820
            Height: =42
      - icoClearAddPersonSearch:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson" && !IsBlank(Trim(txtAddPersonSearch.Text))
            Color: =RGBA(160,160,160,1)
            Tooltip: ="Clear search"
            OnSelect: |-
              =Reset(txtAddPersonSearch);
              ClearCollect(colAddPersonGalResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false))
            X: =1051
            Y: =158
            Width: =22
            Height: =22
      - galAddPersonGalResults:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colAddPersonGalResults
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson" && !IsBlank(Trim(txtAddPersonSearch.Text))
            TemplateSize: =46
            TemplatePadding: =0
            X: =263
            Y: =196
            Width: =820
            Height: =138
          Children:
            - recAddPersonGalResultBg:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(248,250,252,1)
                  HoverFill: =RGBA(233,241,246,1)
                  PressedFill: =RGBA(233,241,246,1)
                  BorderColor: =RGBA(221,227,234,1)
                  BorderThickness: =1
                  X: =0
                  Y: =0
                  Width: =820
                  Height: =42
            - lblAddPersonGalName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.DisplayName
                  Wrap: =false
                  Color: =RGBA(31,58,95,1)
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Font: =Font.'Open Sans'
                  X: =12
                  Y: =2
                  Width: =360
                  Height: =20
            - lblAddPersonGalEmail:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Mail
                  Wrap: =false
                  Color: =RGBA(120,120,120,1)
                  Size: =11
                  Font: =Font.'Open Sans'
                  X: =12
                  Y: =21
                  Width: =360
                  Height: =18
            - btnUseGalPerson:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Use this person"
                  BasePaletteColor: =RGBA(0,78,66,1)
                  OnSelect: |-
                    =Set(varAddPersonNamePrefill, ThisItem.DisplayName);
                    Set(varAddPersonEmailPrefill, Lower(ThisItem.Mail));
                    Reset(txtAddPersonName);
                    Reset(txtAddPersonEmail)
                  X: =640
                  Y: =4
                  Width: =160
                  Height: =34
      - lblAddManualHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Person details"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =14
            Font: =Font.'Open Sans'
            X: =263
            Y: =344
            Width: =400
            Height: =22
      - txtAddPersonName:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =varAddPersonNamePrefill
            Placeholder: ="Full name"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            X: =263
            Y: =372
            Width: =400
            Height: =42
      - txtAddPersonEmail:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =varAddPersonEmailPrefill
            Placeholder: ="Email address"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            X: =683
            Y: =372
            Width: =400
            Height: =42
      - lblAddToGroupsHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Add to groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =14
            Font: =Font.'Open Sans'
            X: =263
            Y: =424
            Width: =400
            Height: =22
      - btnAddPersonTickAll:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Tick all groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            BasePaletteColor: =RGBA(46,110,145,1)
            OnSelect: |-
              =UpdateIf(colAddPersonPicks, true, {Picked: true})
            X: =803
            Y: =420
            Width: =130
            Height: =32
      - btnAddPersonClearGroups:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Clear groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            BasePaletteColor: =RGBA(120,120,120,1)
            OnSelect: |-
              =UpdateIf(colAddPersonPicks, true, {Picked: false})
            X: =943
            Y: =420
            Width: =140
            Height: =32
      - galAddPersonChecklist:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colAddPersonPicks
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            TemplateSize: =36
            TemplatePadding: =0
            X: =263
            Y: =462
            Width: =820
            Height: =144
          Children:
            - chkAddPersonGroup:
                Control: CheckBox@0.0.30
                Properties:
                  BasePaletteColor: =RGBA(156, 220, 79, 1)
                  CheckboxSize: =22
                  Label: =ThisItem.Title & If(ThisItem.Private, " (Private)", "")
                  Checked: =ThisItem.Picked
                  OnCheck: |-
                    =Patch(colAddPersonPicks, ThisItem, {Picked: true})
                  OnUncheck: |-
                    =Patch(colAddPersonPicks, ThisItem, {Picked: false})
                  X: =0
                  Y: =2
                  Width: =800
                  Height: =32
      - btnAddPerson:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Add person"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =Set(varNewPersonEmail, Lower(Trim(txtAddPersonEmail.Text)));
              Set(varNewPersonName, Trim(txtAddPersonName.Text));
              If(
                  IsBlank(varNewPersonName) || IsBlank(Find("@", varNewPersonEmail)) || IsBlank(Find(".", varNewPersonEmail)),
                  Notify("Enter a name and a valid email address.", NotificationType.Warning),
                  CountRows(Filter(colPeople, Lower(Email) = varNewPersonEmail)) > 0,
                  Notify("This email already exists as " & LookUp(colPeople, Lower(Email) = varNewPersonEmail).Name & " - editing them instead.", NotificationType.Warning);
                  Set(varSelectedPersonEmail, varNewPersonEmail);
                  Set(varPeopleLightboxMode, "editPerson");
                  ClearCollect(
                      colPersonGroupPicks,
                      Sort(
                          Sort(
                              AddColumns(
                                  colGroups As grp,
                                  Picked,
                                  CountRows(
                                      Filter(
                                          colMemberships As mem,
                                          Lower(Trim(mem.GroupName)) = Lower(Trim(grp.Title)) && Lower(mem.Email) = varNewPersonEmail
                                      )
                                  ) > 0
                              ),
                              Title,
                              SortOrder.Ascending
                          ),
                          Picked,
                          SortOrder.Descending
                      )
                  );
                  Reset(txtPersonName);
                  Reset(txtPersonEmail),
                  CountRows(Filter(colAddPersonPicks, Picked = true)) = 0,
                  Notify("Tick at least one group to add them to.", NotificationType.Warning),
                  ForAll(
                      Filter(colAddPersonPicks, Picked = true) As grp,
                      Patch('BM Memberships', Defaults('BM Memberships'), {Title: varNewPersonName, Name: varNewPersonName, Email: varNewPersonEmail, GroupName: grp.Title});
                      Patch('BM Groups', LookUp('BM Groups', ID = grp.ID), {Title: grp.Title});
                      Patch('BM History', Defaults('BM History'), {Title: varNewPersonName & " added (" & varNewPersonEmail & ")", GroupName: grp.Title, EventType: {Value: "Added"}})
                  );
                  ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
                  ClearCollect(colPeople, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows)));
                  Set(varAddPersonNamePrefill, "");
                  Set(varAddPersonEmailPrefill, "");
                  Reset(txtAddPersonSearch);
                  Reset(txtAddPersonName);
                  Reset(txtAddPersonEmail);
                  ClearCollect(colAddPersonGalResults, Filter(Office365Users.SearchUserV2({searchTerm: "zzzzzzzzzz", top: 1}).value, false));
                  ClearCollect(colAddPersonPicks, AddColumns(colGroups, Picked, false));
                  Set(varShowLightbox, false);
                  Notify("Added " & varNewPersonName & ".", NotificationType.Success)
              )
            X: =263
            Y: =622
            Width: =300
            Height: =44
      - txtPersonName:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =If(IsBlank(varSelectedPersonEmail), "", LookUp(colPeople, Email = varSelectedPersonEmail).Name)
            Placeholder: ="Full name"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            X: =263
            Y: =160
            Width: =400
            Height: =42
      - txtPersonEmail:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =varSelectedPersonEmail
            Placeholder: ="Email address"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            X: =683
            Y: =160
            Width: =400
            Height: =42
      - lblPersonGroupsHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =14
            Font: =Font.'Open Sans'
            X: =263
            Y: =214
            Width: =400
            Height: =22
      - btnPersonGroupsTickAll:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Tick all groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            BasePaletteColor: =RGBA(46,110,145,1)
            OnSelect: |-
              =UpdateIf(colPersonGroupPicks, true, {Picked: true})
            X: =803
            Y: =210
            Width: =130
            Height: =32
      - btnPersonGroupsClear:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Clear groups"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            BasePaletteColor: =RGBA(120,120,120,1)
            OnSelect: |-
              =UpdateIf(colPersonGroupPicks, true, {Picked: false})
            X: =943
            Y: =210
            Width: =140
            Height: =32
      - galPersonGroupChecklist:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colPersonGroupPicks
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            TemplateSize: =36
            TemplatePadding: =0
            X: =263
            Y: =244
            Width: =820
            Height: =320
          Children:
            - chkGroupMember:
                Control: CheckBox@0.0.30
                Properties:
                  BasePaletteColor: =RGBA(156, 220, 79, 1)
                  CheckboxSize: =22
                  Label: =ThisItem.Title & If(ThisItem.Picked, "  (current member)", "") & If(ThisItem.Private, " (Private)", "")
                  Checked: =ThisItem.Picked
                  OnCheck: |-
                    =Patch(colPersonGroupPicks, ThisItem, {Picked: true})
                  OnUncheck: |-
                    =Patch(colPersonGroupPicks, ThisItem, {Picked: false})
                  X: =0
                  Y: =2
                  Width: =800
                  Height: =32
      - btnSavePersonChanges:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save changes"
            Visible: =varShowLightbox && varPeopleLightboxMode = "editPerson"
            BasePaletteColor: =RGBA(0,78,66,1)
            OnSelect: |-
              =With(
                  {oldEmail: Lower(varSelectedPersonEmail), newEmail: Lower(Trim(txtPersonEmail.Text)), newName: Trim(txtPersonName.Text)},
                  If(
                      IsBlank(newName) || IsBlank(Find("@", newEmail)) || IsBlank(Find(".", newEmail)),
                      Notify("Enter a name and a valid email address.", NotificationType.Warning),
                      newEmail <> oldEmail && CountRows(Filter(colPeople, Lower(Email) = newEmail)) > 0,
                      Notify("That email already belongs to another person.", NotificationType.Warning),
                      If(
                          newEmail <> oldEmail,
                          UpdateIf('BM Memberships', Lower(Email) = oldEmail, {Email: newEmail});
                          ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)))
                      );
                      ForAll(
                          colPersonGroupPicks As grp,
                          With(
                              {existing: LookUp(colMemberships As mem, Lower(Trim(mem.GroupName)) = Lower(Trim(grp.Title)) && Lower(mem.Email) = newEmail)},
                              If(
                                  grp.Picked && IsBlank(existing),
                                  Patch('BM Memberships', Defaults('BM Memberships'), {Title: newName, Name: newName, Email: newEmail, GroupName: grp.Title});
                                  Patch('BM Groups', LookUp('BM Groups', ID = grp.ID), {Title: grp.Title});
                                  Patch('BM History', Defaults('BM History'), {Title: newName & " added (" & newEmail & ")", GroupName: grp.Title, EventType: {Value: "Added"}}),
                                  !grp.Picked && !IsBlank(existing),
                                  Remove('BM Memberships', existing);
                                  Patch('BM Groups', LookUp('BM Groups', ID = grp.ID), {Title: grp.Title});
                                  Patch('BM History', Defaults('BM History'), {Title: newName & " removed (" & newEmail & ")", GroupName: grp.Title, EventType: {Value: "Removed"}}),
                                  grp.Picked && !IsBlank(existing) && (existing.Name <> newName || Lower(existing.Email) <> newEmail),
                                  Patch('BM Memberships', existing, {Title: newName, Name: newName, Email: newEmail})
                              )
                          )
                      );
                      ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
                      ClearCollect(colPeople, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows)));
                      Set(varSelectedPersonEmail, newEmail);
                      Set(varShowLightbox, false);
                      Notify("Saved " & newName & ".", NotificationType.Success)
                  )
              )
            X: =263
            Y: =584
            Width: =260
            Height: =44
      - lblPurgeHint:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="For when someone leaves the branch entirely - finds every group they're in and removes all of them in one go."
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge"
            Color: =RGBA(120,120,120,1)
            Size: =12
            Font: =Font.'Open Sans'
            X: =263
            Y: =160
            Width: =820
            Height: =36
      - txtPurgeSearch:
          Control: ModernTextInput@1.1.0
          Properties:
            Placeholder: ="Search by name or email..."
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge"
            OnChange: =Set(varConfirmPurgeArmed, false)
            X: =263
            Y: =206
            Width: =820
            Height: =44
      - icoClearPurgeSearch:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Cancel
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge" && !IsBlank(Trim(txtPurgeSearch.Text))
            Color: =RGBA(160,160,160,1)
            Tooltip: ="Clear search"
            OnSelect: =Reset(txtPurgeSearch); Set(varConfirmPurgeArmed, false)
            X: =1051
            Y: =217
            Width: =22
            Height: =22
      - lblPurgeMatch:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {p: LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email)},
                  If(IsBlank(Trim(txtPurgeSearch.Text)), "", IsBlank(p), "No current member matches that.", p.Name & "  -  " & p.Email & "  -  member of " & p.GroupCount & " group" & If(p.GroupCount = 1, "", "s"))
              )
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge"
            Color: =RGBA(80,80,80,1)
            Size: =13
            Font: =Font.'Open Sans'
            X: =263
            Y: =260
            Width: =820
            Height: =30
      - galPurgeMatchGroups:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =With(
                  {p: LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email)},
                  If(
                      IsBlank(Trim(txtPurgeSearch.Text)) || IsBlank(p),
                      Filter(Distinct(colMemberships, GroupName), false),
                      Sort(Distinct(Filter(colMemberships, Lower(Email) = Lower(p.Email)), GroupName), Value, SortOrder.Ascending)
                  )
              )
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge" && !IsBlank(Trim(txtPurgeSearch.Text)) && !IsBlank(LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email))
            TemplateSize: =28
            TemplatePadding: =0
            X: =283
            Y: =294
            Width: =780
            Height: =130
          Children:
            - lblPurgeMatchGroupRow:
                Control: Label@2.5.1
                Properties:
                  Text: ="•  " & ThisItem.Value
                  Color: =RGBA(120,120,120,1)
                  Size: =12
                  Font: =Font.'Open Sans'
                  X: =0
                  Y: =2
                  Width: =780
                  Height: =24
      - btnPurgeFromAll:
          Control: ModernButton@1.0.0
          Properties:
            Text: =If(varConfirmPurgeArmed, "Tap again to confirm removal", "Remove from all groups")
            Visible: =varShowLightbox && varPeopleLightboxMode = "purge" && !IsBlank(Trim(txtPurgeSearch.Text)) && !IsBlank(LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email))
            BasePaletteColor: =RGBA(163,45,45,1)
            OnSelect: |-
              =If(
                  !varConfirmPurgeArmed,
                  Set(varConfirmPurgeArmed, true),
                  Set(varPurgeEmail, LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email).Email);
                  Set(varPurgeName, LookUp(colPeople, txtPurgeSearch.Text in Name || txtPurgeSearch.Text in Email).Name);
                  ClearCollect(colPurgeAffectedGroups, Distinct(Filter(colMemberships, Lower(Email) = Lower(varPurgeEmail)), GroupName));
                  Set(varPurgeCount, CountRows(colPurgeAffectedGroups));
                  ForAll(
                      colPurgeAffectedGroups,
                      Patch('BM Groups', LookUp('BM Groups', Title = Value), {Title: Value});
                      Patch('BM History', Defaults('BM History'), {Title: varPurgeName & " removed (left branch - removed from all groups)", GroupName: Value, EventType: {Value: "Removed"}})
                  );
                  RemoveIf('BM Memberships', Lower(Email) = Lower(varPurgeEmail));
                  ClearCollect(colMemberships, Filter('BM Memberships', false)); ForAll(colGroups As grp, Collect(colMemberships, Filter('BM Memberships', GroupName = grp.Title)));
                  ClearCollect(colPeople, AddColumns(GroupBy(colMemberships, Email, Rows), Name, First(Rows).Name, JMC, First(Rows).JMC, County, First(Rows).'County/Contingent', GroupCount, CountRows(Rows)));
                  Reset(txtPurgeSearch);
                  Set(varConfirmPurgeArmed, false);
                  Set(varSelectedPersonEmail, Blank());
                  Set(varShowLightbox, false);
                  Notify("Removed " & varPurgeName & " from " & varPurgeCount & " group" & If(varPurgeCount = 1, "", "s") & ".", NotificationType.Error)
              )
            X: =263
            Y: =436
            Width: =820
            Height: =44
