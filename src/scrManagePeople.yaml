            Height: =28
      - lblAddPersonGalHeading:
          Control: Label@2.5.1
          Properties:
            Text: ="Search GAL"
            Visible: =varShowLightbox && varPeopleLightboxMode = "addPerson"
            Color: =RGBA(31,58,95,1)
            FontWeight: =FontWeight.Bold
            Size: =14
            Font: =Font.'Open Sans'
            X: =263
